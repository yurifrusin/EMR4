schema_version: api-spine.integration-events.v0
artifact_kind: non_invasive_async_contract_example
status: prototype_only
source_safety:
  phi: none
  examples: authored_synthetic
  runtime_wiring: blocked
  proactive_diary_delivery_runtime: blocked
  bounded_local_runtime_exception:
    decision_owner: Yuri
    authorised_on: "2026-07-21"
    event_type: diary.appointment_rescheduled
    evidence_mode: authored_synthetic_local
    delivery: authenticated_practice_scoped_polling
    consumer_reconciliation: exact_active_practitioner_availability_selection_proposal
    feature_default: disabled
    broader_runtime_wiring: blocked
  provider_calls: blocked
  external_clients: blocked
  historical_diary_trove_access: blocked
  h15_or_h_series_runtime_imports: blocked
  memory_rag_graphrag: blocked
notes:
  - Async integrations observe or ingest typed events; they do not bypass command endpoints.
  - The Reception One exception reads the same committed PostgreSQL event row as an outbox-equivalent; it has no publisher, broker, acknowledgement, or command consumer.
  - Every real integration endpoint will require an integration principal, idempotency, signature verification, tenancy checks, and audit.
  - Payload examples here are placeholders and intentionally omit patient names, phone numbers, Medicare, DOB, result text, invoice details, and provider secrets.

common_envelope:
  required_fields:
    - event_id
    - event_type
    - schema_version
    - occurred_at
    - received_at
    - practice_id
    - source_system
    - correlation_id
    - idempotency_key
    - principal
    - evidence_mode
  principal:
    allowed_kinds:
      - integration_service_account
      - mtls_certificate
      - signed_hmac_sender
    user_session_token_allowed: false
  evidence_mode:
    allowed_values:
      - fixture_intercepted
      - fake_provider
      - local_live_backend
      - live_provider
    default_for_this_artifact: fixture_intercepted
  idempotency:
    scope: practice_id_plus_idempotency_key
    minimum_retention_hours: 24
  audit_posture:
    mutation_or_external_call: required
    phi_in_metadata: forbidden

event_families:
  - family_id: diary
    research_status: bounded_local_reschedule_runtime_authorised_broader_family_blocked
    direction: emit
    event_types:
      - diary.appointment_created
      - diary.appointment_rescheduled
      - diary.appointment_cancelled
      - diary.appointment_status_changed
      - diary.proposal_staged
      - diary.proposal_expired
      - diary.waiting_state_changed
      - diary.roster_changed
    authorised_runtime_subset:
      event_type: diary.appointment_rescheduled
      schema_version: diary.appointment_rescheduled.v1
      producer: existing_signed_update_confirmation_only
      write_transaction: appointment_plus_audit_plus_idempotency_plus_event
      read_route: GET /api/v1/diary/events/committed
      cursor: signed_practice_bound_opaque_coordinate
      event_payload_phi: none
      fresh_appointment_and_projection_read_required: true
      availability_reconciliation: fresh_slot_search_candidate_comparison
      local_authored_synthetic_only: true
      enabled_by_default: false
    allowed_payload_fields:
      - aggregate_id
      - aggregate_revision
      - appointment_id
      - proposal_id
      - session_id
      - practitioner_id
      - location_id
      - starts_at
      - ends_at
      - previous_status_code
      - current_status_code
      - reason_codes
    prohibited_payload_fields:
      - patient_name
      - phone_number
      - date_of_birth
      - medicare_number
      - appointment_reason_text
      - appointment_note
      - raw_instruction
      - free_text_transcript
      - provider_output
      - credential
    delivery_semantics:
      publish_after_commit_only: true
      transactional_outbox_or_equivalent_required: true
      at_least_once_transport_permitted: true
      stable_event_identity_required: true
      aggregate_revision_required: true
      user_visible_deduplication_required: true
      fresh_scoped_read_before_display: true
    attention_boundary:
      low_interruption_filter_required: true
      practice_role_resource_recheck_required: true
      unrelated_event_suppression_required: true
      unchanged_availability_silent: true
      invalid_selected_or_proposed_slot_cleared: true
      explain_why_required: true
      user_controls:
        - dismiss
        - snooze
        - mute_event_family
        - show_context
      automatic_spoken_phi: false
    command_boundary:
      event_is_command_authority: false
      may_refresh_authorized_read_context: true
      may_offer_intent_projected_view: true
      may_prepare_proposal_only: true
      automatic_proposal_from_event: false
      appointment_mutation_requires_rest_command: true
      staff_confirmation_required_for_mutation: true

  - family_id: caller_id
    research_status: placeholder
    direction: ingest
    event_types:
      - caller_id.context_observed
      - caller_id.call_state_changed
      - caller_id.candidate_match_changed
    allowed_payload_fields:
      - call_context_id
      - call_state
      - candidate_count
      - confidence_bucket
      - match_reason_codes
      - observed_at
    prohibited_payload_fields:
      - raw_phone_number
      - patient_name
      - date_of_birth
      - medicare_number
      - free_text_transcript
    command_boundary:
      may_rank_candidates: true
      may_verify_identity: false
      may_confirm_appointment: false

  - family_id: sms
    research_status: placeholder
    direction: emit_and_ingest
    event_types:
      - sms.message_send_requested
      - sms.message_sent
      - sms.message_failed
      - sms.reply_received
      - sms.reminder_outcome_recorded
    allowed_payload_fields:
      - message_id
      - template_id
      - delivery_status
      - reply_category
      - appointment_reference_id
      - provider_status_code
    prohibited_payload_fields:
      - raw_phone_number
      - sms_body
      - patient_name
      - medicare_number
      - date_of_birth
    command_boundary:
      send_requires_rest_command: true
      replies_may_trigger_proposal_only: true
      appointment_mutation_requires_confirm_command: true

  - family_id: pathology
    research_status: placeholder
    direction: ingest
    event_types:
      - pathology.result_ingested
      - pathology.result_triage_requested
      - pathology.result_filed
      - pathology.result_acknowledged
    allowed_payload_fields:
      - result_reference_id
      - source_facility_code
      - result_category
      - abnormal_flag_bucket
      - received_at
      - attachment_reference_id
    prohibited_payload_fields:
      - result_text
      - patient_name
      - date_of_birth
      - medicare_number
      - provider_number
      - raw_hl7_message
    command_boundary:
      ingest_endpoint_is_command: true
      filing_requires_clinician_or_policy_command: true
      consultant_advice_requires_doctor_review: true

  - family_id: billing
    research_status: placeholder
    direction: emit_and_ingest
    event_types:
      - billing.invoice_created
      - billing.claim_submit_requested
      - billing.claim_submitted
      - billing.claim_rejected
      - billing.payment_received
      - billing.reconciliation_completed
    allowed_payload_fields:
      - billing_reference_id
      - claim_reference_id
      - amount_bucket
      - payment_status
      - rejection_reason_code
      - reconciliation_batch_id
    prohibited_payload_fields:
      - card_number
      - bank_account_number
      - medicare_number
      - patient_name
      - date_of_birth
      - full_invoice_line_text
    command_boundary:
      claim_submission_requires_rest_command: true
      idempotency_required: true
      confirmer_required_for_regulated_submission: true

  - family_id: knowledge_refresh
    research_status: placeholder
    direction: ingest
    event_types:
      - knowledge_source.refresh_started
      - knowledge_source.refresh_completed
      - knowledge_source.refresh_failed
      - knowledge_source.citation_index_changed
    allowed_payload_fields:
      - knowledge_source_id
      - license_namespace
      - citation_count_bucket
      - refresh_status
      - source_freshness_date
    prohibited_payload_fields:
      - licensed_full_text
      - raw_passage_text
      - patient_query_text
      - provider_api_key
      - embedding_vector
    command_boundary:
      clinician_query_runtime: blocked
      live_licensed_provider_runtime: blocked
      citations_required_when_opened: true

blocked_gates:
  proactive_diary_delivery_runtime: blocked_except_reception_one_local_reschedule
  live_provider_runtime: blocked
  regulated_external_integrations: blocked
  historical_diary_trove_or_h15_runtime_imports: blocked
  memory_rag_graphrag_runtime: blocked
  model_to_database_writes: blocked
  graph_ql_mutations: blocked
