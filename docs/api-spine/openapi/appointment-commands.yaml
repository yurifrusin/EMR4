openapi: 3.1.0
info:
  title: EMR4 Appointment Command Surface Draft
  version: 0.1.0
  summary: Appointment-first REST/OpenAPI command envelope prototype.
  description: >
    Sprint 101 non-invasive schema draft for appointment proposal, confirmation,
    and slot-search command-style read surfaces. This artifact documents the
    command plane only. It does not define runtime routes, provider wiring,
    memory/RAG/GraphRAG access, historical diary trove access, or GraphQL
    mutations. GraphQL may expose read/context state and affordance hints, but
    it cannot execute these commands or act as a generic command tunnel.
servers:
  - url: https://api.example.invalid/api/v1
    description: Documentation placeholder; not a live EMR4 endpoint.
tags:
  - name: AppointmentCommands
    description: Staff-confirmed scheduling commands and proposal preparation.
  - name: SlotSearchCommands
    description: Non-mutating command-style reads that prepare executable proposals.
  - name: ReceptionOneRuntime
    description: Default-off authored-synthetic proposal composition.

x-emr4-current-backend-alignment:
  sprint: 123
  status: canonical_status_confirm_runtime_alias_mounted
  reviewed_on: "2026-08-13"
  backend_prefix: /api/v1
  source_inventory: orchestration/api_spine_appointment_command_alignment_inventory.md
  guard_test: tests/test_api_spine_appointment_openapi_drift_guard.py
  canonical_path_drift:
    - current_backend_path: /appointments/proposals/status-confirm
      canonical_openapi_path: /appointments/proposals/status/confirm
      operation_id: confirmAppointmentStatusProposal
      disposition: canonical_runtime_path_mounted_compatibility_alias_retained
    - current_backend_path: /appointments/proposals/delete-confirm
      canonical_openapi_path: /appointments/proposals/delete/confirm
      operation_id: confirmAppointmentDeleteProposal
      disposition: documented_current_backend_alias_candidate
    - current_backend_path: /appointments/proposals/slot-search/selection
      canonical_openapi_path: /appointments/proposals/slot-search/select
      operation_id: selectSlotForCreateProposal
      disposition: documented_current_backend_alias_candidate
  compatibility_write_routes:
    - method: POST
      current_backend_path: /appointments
      handler: create_appointment
      posture: legacy_compatibility_write_outside_proposal_confirm_envelope
    - method: PUT
      current_backend_path: /appointments/{appointment_id}
      handler: update_appointment
      posture: legacy_compatibility_write_outside_proposal_confirm_envelope
    - method: PATCH
      current_backend_path: /appointments/{appointment_id}/status
      handler: update_appointment_status
      posture: legacy_compatibility_write_outside_proposal_confirm_envelope
    - method: DELETE
      current_backend_path: /appointments/{appointment_id}
      handler: cancel_appointment
      posture: legacy_compatibility_write_outside_proposal_confirm_envelope
  bernie_backend_variants:
    - method: POST
      current_backend_path: /appointments/proposals/bernie/tool-intent
      handler: propose_bernie_tool_intent
      posture: command_style_read_no_appointment_write
    - method: POST
      current_backend_path: /appointments/proposals/bernie/interpret-booking-instruction
      handler: interpret_bernie_booking_instruction
      posture: command_style_read_default_disabled_provider_boundary
    - method: POST
      current_backend_path: /appointments/proposals/bernie/supervised-booking
      handler: propose_bernie_supervised_booking
      posture: command_style_read_no_confirm_or_create
    - method: POST
      current_backend_path: /appointments/proposals/create/confirm-bernie
      handler: confirm_bernie_create_proposal
      posture: create_confirm_family_variant
      stage2_local_synthetic_checkpoint:
        durable_session_state: postgresql_transactional
        command_claim: atomic_on_conflict_then_row_lock
        correlation: command_appointment_audit_session_receipt
        practice_isolation: route_scope_plus_forced_rls_non_bypass_probe
        audit_evidence: append_only_trigger
        production_runtime_role: blocked_pending_fresh_decision
    - method: POST
      current_backend_path: /appointments/proposals/bernie/no-slot-suggestion-selection
      handler: select_no_slot_suggestion
      posture: command_style_read_next_request_only
    - method: GET
      current_backend_path: /appointments/bernie/pilot-eligibility
      handler: get_bernie_pilot_eligibility
      posture: read_only_pilot_gate_check
    - method: GET
      current_backend_path: /appointments/bernie/sessions/active
      handler: get_active_bernie_session
      posture: session_state_read_or_initialize_no_appointment_write
    - method: POST
      current_backend_path: /appointments/bernie/sessions/new
      handler: create_new_bernie_session
      posture: session_state_only_no_appointment_write
    - method: POST
      current_backend_path: /appointments/bernie/sessions/{session_id}/events
      handler: append_bernie_session_event
      posture: session_state_only_no_appointment_write
  blocked_gates:
    - live_providers
    - runtime_fga_clients
    - external_patient_clients
    - graphql_mutations
    - broad_historical_diary_trove_mining
    - h15_h_series_runtime_imports
    - memory_rag_graphrag_runtime_wiring
    - model_to_database_writes

paths:
  /appointments/proposals/create:
    post:
      tags: [AppointmentCommands]
      operationId: proposeAppointmentCreate
      summary: Prepare a create-appointment proposal envelope.
      description: >
        Resolves current diary state, policy, tenant scope, conflicts, breaks,
        identity, and freshness. Returns a typed proposal for staff review; it
        does not create an appointment.
      x-emr4-proposal-header-posture:
        runtime_validation: non_blank_only
        openapi_min_length_runtime_enforcement: deferred_until_client_readiness_decision
        replay_model: deterministic_re_evaluation_no_proposal_ledger
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateProposalCommand"
            examples:
              safeCreateProposal:
                $ref: "#/components/examples/AppointmentCreateProposalCommand"
      responses:
        "200":
          description: Proposal prepared for staff confirmation or blocked with typed reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentCreateProposalEnvelope"
              examples:
                confirmationReady:
                  $ref: "#/components/examples/AppointmentCreateProposalEnvelope"

  /appointments/proposals/create/confirm:
    post:
      tags: [AppointmentCommands]
      operationId: confirmAppointmentCreateProposal
      summary: Confirm backend-prepared create proposal evidence.
      description: >
        Writes only after explicit confirmation. The backend recomputes the
        proposal, verifies freshness, signed evidence, confirmer authority,
        tenant scope, warnings, and blocks before creating the appointment and
        emitting audit evidence.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateConfirmationCommand"
            examples:
              confirmCreate:
                $ref: "#/components/examples/AppointmentCreateConfirmationCommand"
      responses:
        "200":
          description: Confirmed write result, or a blocked confirmation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmResultEnvelope"
              examples:
                confirmed:
                  $ref: "#/components/examples/AppointmentConfirmResultEnvelope"

  /appointments/proposals/update:
    post:
      tags: [AppointmentCommands]
      operationId: proposeAppointmentUpdate
      summary: Prepare an update/reschedule proposal envelope.
      description: >
        Non-mutating preparation for appointment time, duration, practitioner,
        appointment type, patient/provisional name, reason, or notes changes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateProposalCommand"
      responses:
        "200":
          description: Update proposal prepared or blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentUpdateProposalEnvelope"

  /appointments/proposals/update/confirm:
    post:
      tags: [AppointmentCommands]
      operationId: confirmAppointmentUpdateProposal
      summary: Confirm backend-prepared update proposal evidence.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateConfirmationCommand"
      responses:
        "200":
          description: Confirmed update result, or a blocked confirmation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmResultEnvelope"

  /appointments/proposals/status:
    post:
      tags: [AppointmentCommands]
      operationId: proposeAppointmentStatus
      summary: Prepare a status or waiting-area proposal envelope.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStatusProposalCommand"
      responses:
        "200":
          description: Status/waiting-area proposal prepared or blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentStatusProposalEnvelope"

  /appointments/proposals/status/confirm:
    post:
      tags: [AppointmentCommands]
      operationId: confirmAppointmentStatusProposal
      summary: Confirm backend-prepared status proposal evidence.
      description: >
        Status-only atomic confirmation. The legacy
        /appointments/proposals/status-confirm spelling remains a hidden
        compatibility alias over this same handler. Waiting-area proposals fail
        closed and have no route-local write fallback.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStatusConfirmationCommand"
      responses:
        "200":
          description: Confirmed status result, or a blocked confirmation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmResultEnvelope"

  /appointments/proposals/check-in/{appointment_id}:
    post:
      tags: [AppointmentCommands]
      operationId: proposeAppointmentCheckIn
      summary: >
        Prepare a dedicated A5.1 Rayleen check-in proposal for the exact
        Booked|Confirmed -> Arrived transition with an optional compatible active
        waiting area.
      description: >
        Default-off, authored-synthetic-practice-only, Receptionist-confirmed
        command proposal. Non-mutating. Returns one opaque HMAC-signed,
        maximum-120-second, random-nonce, purpose-bound,
        actor/practice/appointment/state/waiting-area/freshness-bound evidence
        token. Does not widen the generic status-confirm route.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCheckInProposalCommand"
      responses:
        "200":
          description: Check-in proposal prepared or blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentCheckInProposalEnvelope"

  /appointments/proposals/check-in/confirm:
    post:
      tags: [AppointmentCommands]
      operationId: confirmAppointmentCheckInProposal
      summary: Confirm one backend-prepared A5.1 Rayleen check-in proposal.
      description: >
        Receptionist-confirmed atomic check-in. One transaction updates status to
        Arrived with the optional assigned area, appends one command-bound audit
        and one patient-free diary.appointment_checked_in committed event, and
        completes one bounded idempotency receipt. Same-key replay resolves from
        the stored receipt before evidence consumption; different-key reuse of
        the same evidence hash returns confirmation_replay_rejected.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCheckInConfirmationCommand"
      responses:
        "200":
          description: Confirmed check-in result, or a blocked confirmation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmCheckInResult"

  /appointments/proposals/delete:
    post:
      tags: [AppointmentCommands]
      operationId: proposeAppointmentDelete
      summary: Prepare a delete/cancel proposal envelope.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentDeleteProposalCommand"
      responses:
        "200":
          description: Delete proposal prepared or blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDeleteProposalEnvelope"

  /appointments/proposals/delete/confirm:
    post:
      tags: [AppointmentCommands]
      operationId: confirmAppointmentDeleteProposal
      summary: Confirm backend-prepared delete/cancel proposal evidence.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentDeleteConfirmationCommand"
      responses:
        "200":
          description: Confirmed delete/cancel result, or a blocked confirmation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConfirmResultEnvelope"

  /appointments/proposals/slot-search/normalize:
    post:
      tags: [SlotSearchCommands]
      operationId: normalizeSlotSearchCommand
      summary: Normalize staff/agent slot-search input.
      description: >
        Command-style read. Produces deterministic normalized constraints and
        typed warnings/blocks; it does not search slots, write state, call
        providers, or create proposal authority.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotSearchNormalizeCommand"
            examples:
              normalize:
                $ref: "#/components/examples/SlotSearchNormalizeCommand"
      responses:
        "200":
          description: Normalized slot-search command or typed block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSearchNormalizeEnvelope"
              examples:
                normalized:
                  $ref: "#/components/examples/SlotSearchNormalizeEnvelope"

  /appointments/proposals/slot-search:
    post:
      tags: [SlotSearchCommands]
      operationId: proposeSlotSearch
      summary: Search candidate slots from normalized constraints.
      description: >
        Command-style read. Returns candidate slots and freshness evidence for
        later selection; it does not reserve or create an appointment.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotSearchProposalCommand"
            examples:
              propose:
                $ref: "#/components/examples/SlotSearchProposalCommand"
      responses:
        "200":
          description: Candidate slots, no-slot suggestions, or typed block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSearchProposalEnvelope"
              examples:
                candidates:
                  $ref: "#/components/examples/SlotSearchProposalEnvelope"

  /appointments/proposals/reception-one/compose:
    post:
      tags: [ReceptionOneRuntime]
      operationId: composeReceptionOneProductContextProposal
      summary: Compose one typed Reception One proposal from bounded context.
      description: >
        Default-off development-only command-style read for an explicitly
        allowlisted authored-synthetic practice. The trusted backend performs
        bounded practice-scoped context and slot reads, exposes only
        request-scoped opaque handles to the planner, and releases only a
        proofread proposal or clarification. The deterministic planner remains
        the default. A separately gated isolated_vertex mode may call the exact
        approved Sydney Vertex lane through the one-use broker and deterministic
        proofreader, with no provider, model, project, identity, region or
        deterministic-planner fallback. Neither mode confirms or writes an
        appointment or changes the legacy interpreter gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceptionOneProductContextRequest"
      responses:
        "200":
          description: Typed proposal, clarification, revision request, or block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionOneProductContextProposal"
        "403":
          description: Environment or practice was not admitted.
        "404":
          description: The default-off runtime is not enabled.
        "502":
          description: >
            The separately gated isolated planner failed closed before a
            proofreader-admitted proposal could be returned.

  /appointments/proposals/slot-search/select:
    post:
      tags: [SlotSearchCommands]
      operationId: selectSlotForCreateProposal
      summary: Select one slot candidate and prepare create-proposal evidence.
      description: >
        Command-style read that transforms a selected candidate into a
        create-appointment proposal envelope. The returned proposal still
        requires explicit staff confirmation through the command plane.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotSelectionCommand"
            examples:
              select:
                $ref: "#/components/examples/SlotSelectionCommand"
      responses:
        "200":
          description: Create proposal prepared from the selected slot, or typed block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSelectionProposalEnvelope"
              examples:
                selected:
                  $ref: "#/components/examples/SlotSelectionProposalEnvelope"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated key for mutating or confirmation-grade command
        attempts. The server must bind it to actor, practice, operation, and
        request body hash before replaying a prior result.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        examples: ["idem_01J2SLOTCONFIRM000000000001"]
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Request correlation id propagated into audit and event records.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        examples: ["corr_01J2BOOKINGFLOW0000000001"]

  schemas:
    Uuid:
      type: string
      format: uuid

    ClinicDate:
      type: string
      format: date

    ClinicTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
      examples: ["09:30:00"]

    DateTime:
      type: string
      format: date-time

    ActorRef:
      type: object
      required: [actor_id, actor_type, display, role]
      additionalProperties: false
      properties:
        actor_id:
          $ref: "#/components/schemas/Uuid"
        actor_type:
          type: string
          enum: [human_user, agent, integration]
        display:
          type: string
        role:
          type: string
          enum: [receptionist, practice_manager, gp, nurse, admin, agent, integration]
        practitioner_id:
          $ref: "#/components/schemas/Uuid"

    ConfirmerRef:
      type: object
      required: [confirmed_by_user_id, confirmed_by_display, confirmed_at]
      additionalProperties: false
      properties:
        confirmed_by_user_id:
          $ref: "#/components/schemas/Uuid"
        confirmed_by_display:
          type: string
        confirmed_by_role:
          type: string
        confirmed_at:
          $ref: "#/components/schemas/DateTime"
        confirmation_surface:
          type: string
          enum: [diary_grid, bernie_staff_review, command_centre, api_client]

    PracticeScope:
      type: object
      required: [practice_id]
      additionalProperties: false
      properties:
        practice_id:
          $ref: "#/components/schemas/Uuid"
        location_id:
          $ref: "#/components/schemas/Uuid"

    CommandMeta:
      type: object
      required: [actor, practice, correlation_id, requested_at]
      additionalProperties: false
      properties:
        actor:
          $ref: "#/components/schemas/ActorRef"
        practice:
          $ref: "#/components/schemas/PracticeScope"
        correlation_id:
          type: string
        requested_at:
          $ref: "#/components/schemas/DateTime"
        source_surface:
          type: string
          enum: [diary_grid, bernie_staff_review, taskpane, command_centre, api_client]
        evidence_label:
          type: string
          enum: [live_api_fact, staff_selected, caller_signal, manifest_policy, model_interpretation, fixture_intercepted]

    FreshnessRef:
      type: object
      required: [freshness_id, basis, generated_at, expires_at]
      additionalProperties: false
      properties:
        freshness_id:
          type: string
        basis:
          type: string
          enum:
            - create_proposal
            - update_proposal
            - status_proposal
            - delete_proposal
            - candidate_slot
            - bernie_session
        generated_at:
          $ref: "#/components/schemas/DateTime"
        expires_at:
          $ref: "#/components/schemas/DateTime"
        server_session_id:
          type: string
        server_session_revision:
          type: integer
          minimum: 0

    SignedConfirmationEvidence:
      type: object
      required: [scheme, key_id, signed_at, payload_hash, signature, covered_fields]
      additionalProperties: false
      properties:
        scheme:
          type: string
          enum: [emr4-hmac-sha256-v1]
        key_id:
          type: string
        signed_at:
          $ref: "#/components/schemas/DateTime"
        payload_hash:
          type: string
        signature:
          type: string
        covered_fields:
          type: array
          items:
            type: string

    Issue:
      type: object
      required: [code, severity, message]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [break_overlap, conflict_detected, stale_proposal_freshness_id]
        severity:
          type: string
          enum: [warning, blocked]
        message:
          type: string
        field:
          type: string

    AuditIntent:
      type: object
      required: [audit_action, target_kind, expected_audit_event]
      additionalProperties: false
      properties:
        audit_action:
          type: string
          enum:
            - appointment_proposal_prepared
            - appointment_created
            - appointment_updated
            - appointment_status_changed
            - appointment_deleted
            - slot_search_normalized
            - slot_search_proposed
            - slot_selected_for_proposal
        target_kind:
          type: string
          enum: [appointment, slot_search, proposal]
        expected_audit_event:
          type: string
        audit_tags:
          type: array
          items:
            type: string

    AppointmentCommandFields:
      type: object
      required: [practitioner_id, appointment_date, start_time_local, duration_minutes]
      additionalProperties: false
      properties:
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        patient_id:
          $ref: "#/components/schemas/Uuid"
        patient_name_provisional:
          type: string
        practitioner_id:
          $ref: "#/components/schemas/Uuid"
        appointment_type_id:
          $ref: "#/components/schemas/Uuid"
        location_id:
          $ref: "#/components/schemas/Uuid"
        appointment_date:
          $ref: "#/components/schemas/ClinicDate"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        start_time:
          $ref: "#/components/schemas/DateTime"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 480
        reason:
          type: string
        notes:
          type: string
        booked_via:
          type: string
          enum: [Receptionist, Online, Phone, WalkIn, Bernie]

    ProposalEnvelopeBase:
      type: object
      required:
        - intent
        - safe
        - requires_confirmation
        - autonomy_tier
        - summary
        - command
        - warnings
        - blocks
        - audit
      properties:
        intent:
          type: string
        safe:
          type: boolean
        requires_confirmation:
          type: boolean
        autonomy_tier:
          type: string
          enum: [execute_with_report, proposal, blocked]
        summary:
          type: string
        command:
          $ref: "#/components/schemas/AppointmentCommandFields"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        confirm_endpoint:
          type: string
        confirm_payload:
          type: object
          additionalProperties: true
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean
          default: false
        audit:
          $ref: "#/components/schemas/AuditIntent"

    AppointmentCreateProposalCommand:
      type: object
      required: [meta, command]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        command:
          $ref: "#/components/schemas/AppointmentCommandFields"

    AppointmentCreateProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ProposalEnvelopeBase"
        - type: object
          properties:
            intent:
              const: create_appointment
            patient_identity:
              type: string
              enum: [linked, provisional]
            conflict:
              $ref: "#/components/schemas/AppointmentConflict"
            breaks_overlap:
              type: array
              items:
                type: string

    AppointmentUpdateProposalCommand:
      type: object
      required: [meta, appointment_id, patch]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        patch:
          type: object
          additionalProperties: false
          properties:
            patient_id:
              $ref: "#/components/schemas/Uuid"
            patient_name_provisional:
              type: string
            practitioner_id:
              $ref: "#/components/schemas/Uuid"
            appointment_type_id:
              $ref: "#/components/schemas/Uuid"
            location_id:
              $ref: "#/components/schemas/Uuid"
            appointment_date:
              $ref: "#/components/schemas/ClinicDate"
            start_time_local:
              $ref: "#/components/schemas/ClinicTime"
            duration_minutes:
              type: integer
              minimum: 1
              maximum: 480
            reason:
              type: string
            notes:
              type: string

    AppointmentUpdateProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ProposalEnvelopeBase"
        - type: object
          properties:
            intent:
              const: update_appointment
            conflict:
              $ref: "#/components/schemas/AppointmentConflict"

    AppointmentStatusProposalCommand:
      type: object
      required: [meta, appointment_id, status]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [Booked, Confirmed, Arrived, InConsult, Completed, Cancelled, DNA, NoShow]
        waiting_area_id:
          $ref: "#/components/schemas/Uuid"
        status_reason_code:
          type: string
          enum:
            - PATIENT_CANCELLED
            - PATIENT_RESCHEDULED
            - PATIENT_UNWELL
            - PATIENT_TRANSPORT
            - PRACTITIONER_UNAVAILABLE
            - CLINIC_OPERATIONAL
            - CLINIC_RESCHEDULED
            - ADMIN_ERROR
            - DUPLICATE_BOOKING
            - DID_NOT_ATTEND
            - LEFT_WITHOUT_SEEN
            - OTHER
            - LEGACY_UNCLASSIFIED

    AppointmentStatusProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ProposalEnvelopeBase"
        - type: object
          properties:
            intent:
              enum: [update_appointment_status, update_appointment_waiting_area]
            status_proposal_version_binding:
              $ref: "#/components/schemas/StatusProposalVersionBinding"

    AppointmentStatusOnlyProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/AppointmentStatusProposalEnvelope"
        - type: object
          properties:
            intent:
              const: update_appointment_status

    StatusProposalVersionBinding:
      type: object
      required: [schema_version, source_version, evidence_signature, signature]
      additionalProperties: false
      properties:
        schema_version:
          const: raisa.status_proposal_version_binding.v1
        source_version:
          type: integer
          minimum: 1
          readOnly: true
        evidence_signature:
          type: string
          minLength: 64
          maxLength: 64
          readOnly: true
        signature:
          type: string
          minLength: 64
          maxLength: 64
          readOnly: true

    AppointmentDeleteProposalCommand:
      type: object
      required: [meta, appointment_id, delete_reason]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        delete_reason:
          type: string
        status_reason_code:
          type: string

    AppointmentDeleteProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ProposalEnvelopeBase"
        - type: object
          properties:
            intent:
              const: delete_appointment

    AppointmentCreateConfirmationCommand:
      type: object
      required: [meta, confirmer, confirmed, create_proposal, confirmed_warnings, freshness]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        confirmed:
          const: true
        create_proposal:
          $ref: "#/components/schemas/AppointmentCreateProposalEnvelope"
        confirmed_warnings:
          type: array
          items:
            type: string
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean
        session_binding:
          $ref: "#/components/schemas/SessionBinding"

    AppointmentUpdateConfirmationCommand:
      type: object
      required: [meta, confirmer, confirmed, update_proposal, confirmed_warnings, freshness]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        confirmed:
          const: true
        update_proposal:
          $ref: "#/components/schemas/AppointmentUpdateProposalEnvelope"
        confirmed_warnings:
          type: array
          items:
            type: string
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean
        session_binding:
          $ref: "#/components/schemas/SessionBinding"

    AppointmentStatusConfirmationCommand:
      type: object
      required: [meta, confirmer, confirmed, status_proposal, confirmed_warnings, freshness, status_proposal_version_binding]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        confirmed:
          const: true
        status_proposal:
          $ref: "#/components/schemas/AppointmentStatusOnlyProposalEnvelope"
        status_proposal_version_binding:
          $ref: "#/components/schemas/StatusProposalVersionBinding"
        confirmed_warnings:
          type: array
          items:
            type: string
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean

    AppointmentCheckInProposalCommand:
      type: object
      required: [meta, appointment_id]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        waiting_area_id:
          $ref: "#/components/schemas/Uuid"
          description: >
            Assign only when no waiting area is currently set; omitted/null
            preserves an existing area and never removes or moves it.

    AppointmentCheckInProposalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ProposalEnvelopeBase"
        - type: object
          properties:
            intent:
              const: check_in_appointment
            command:
              type: object
              additionalProperties: false
              required: [appointment_id]
              properties:
                appointment_id:
                  $ref: "#/components/schemas/Uuid"
                waiting_area_id:
                  $ref: "#/components/schemas/Uuid"
                waiting_area_id_supplied:
                  type: boolean
            check_in_proposal_freshness_id:
              type: string
            signed_confirmation_evidence:
              type: string
              format: token
              description: >
                One opaque patient-free base64url HMAC-signed evidence token with
                a random nonce, exact purpose and maximum 120-second lifetime.
                Client-visible structured claims cannot be submitted as a
                substitute.
            signed_confirmation_evidence_required:
              type: boolean
            evidence_expires_at:
              type: string
              format: date-time

    AppointmentCheckInConfirmationCommand:
      type: object
      required: [meta, confirmer, confirmed, check_in_proposal, confirmed_warnings, freshness]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        confirmed:
          const: true
        check_in_proposal:
          $ref: "#/components/schemas/AppointmentCheckInProposalEnvelope"
        confirmed_warnings:
          type: array
          items:
            type: string
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          type: string
          format: token
        signed_confirmation_evidence_required:
          type: boolean

    AppointmentConfirmCheckInResult:
      type: object
      required: [intent, safe, requires_confirmation, autonomy_tier, summary, warnings, blocks, audit_evidence]
      additionalProperties: false
      properties:
        intent:
          const: confirm_check_in_appointment
        safe:
          type: boolean
        requires_confirmation:
          type: boolean
        autonomy_tier:
          type: string
          enum: [confirmed_write, blocked]
        summary:
          type: string
        receipt:
          $ref: "#/components/schemas/AppointmentCheckInReceipt"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        audit_evidence:
          type: array
          items:
            type: string

    AppointmentCheckInReceipt:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - appointment_id
        - status
        - waiting_area_id
        - audit_log_id
        - event_id
        - command_id
        - commit_time
      properties:
        schema_version:
          const: appointment.check_in_receipt.v1
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: Arrived
        waiting_area_id:
          $ref: "#/components/schemas/Uuid"
        audit_log_id:
          $ref: "#/components/schemas/Uuid"
        event_id:
          $ref: "#/components/schemas/Uuid"
        command_id:
          $ref: "#/components/schemas/Uuid"
        commit_time:
          type: string
          format: date-time
      description: >
        Bounded, patient-free A5.1 confirmation receipt containing only
        appointment id, resulting status, resulting waiting-area id, audit id,
        event id, command id and commit time.

    AppointmentDeleteConfirmationCommand:
      type: object
      required: [meta, confirmer, confirmed, delete_proposal, confirmed_warnings, freshness]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        confirmed:
          const: true
        delete_proposal:
          $ref: "#/components/schemas/AppointmentDeleteProposalEnvelope"
        confirmed_warnings:
          type: array
          items:
            type: string
        freshness:
          $ref: "#/components/schemas/FreshnessRef"
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean

    AppointmentConfirmResultEnvelope:
      type: object
      required: [intent, safe, requires_confirmation, autonomy_tier, summary, warnings, blocks, audit_evidence]
      additionalProperties: false
      properties:
        intent:
          type: string
          enum:
            - confirm_create_appointment
            - confirm_update_appointment
            - confirm_status_appointment
            - confirm_delete_appointment
        safe:
          type: boolean
        requires_confirmation:
          type: boolean
        autonomy_tier:
          type: string
          enum: [confirmed_write, blocked]
        summary:
          type: string
        appointment:
          $ref: "#/components/schemas/AppointmentSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        audit_evidence:
          type: array
          items:
            type: string
        audit_event:
          $ref: "#/components/schemas/ConfirmationAuditEvent"
        confirmation_receipt:
          allOf:
            - $ref: "#/components/schemas/ConfirmationReceipt"
          description: >
            Successful create confirmations may return the stored v1 receipt.
            Blocked confirmations and non-create confirmation families omit it.

    SlotSearchNormalizeCommand:
      type: object
      required: [meta, raw_request]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        raw_request:
          type: object
          additionalProperties: false
          properties:
            instruction:
              type: string
            reference_date:
              $ref: "#/components/schemas/ClinicDate"
            date_from:
              $ref: "#/components/schemas/ClinicDate"
            date_to:
              $ref: "#/components/schemas/ClinicDate"
            practitioner_id:
              $ref: "#/components/schemas/Uuid"
            duration_minutes:
              type: integer
              minimum: 1
              maximum: 480

    SlotSearchNormalizeEnvelope:
      type: object
      required: [intent, safe, result, normalized, warnings, blocks, audit]
      additionalProperties: false
      properties:
        intent:
          const: search_slots_from_command
        safe:
          type: boolean
        result:
          type: string
          enum: [normalized, blocked, missing_fields]
        normalized:
          $ref: "#/components/schemas/SlotSearchConstraint"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        audit:
          $ref: "#/components/schemas/AuditIntent"

    SlotSearchProposalCommand:
      type: object
      required: [meta, constraint]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        constraint:
          $ref: "#/components/schemas/SlotSearchConstraint"

    SlotSearchProposalEnvelope:
      type: object
      required: [intent, safe, requires_confirmation, autonomy_tier, summary, candidates, warnings, blocks, audit]
      additionalProperties: false
      properties:
        intent:
          const: search_slots
        safe:
          type: boolean
        requires_confirmation:
          const: false
        autonomy_tier:
          type: string
          enum: [execute_with_report, blocked]
        summary:
          type: string
        constraint:
          $ref: "#/components/schemas/SlotSearchConstraint"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SlotCandidate"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        candidate_freshness_id:
          type: string
        audit:
          $ref: "#/components/schemas/AuditIntent"

    SlotSelectionCommand:
      type: object
      required: [meta, search_proposal, selected_candidate]
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/CommandMeta"
        search_proposal:
          $ref: "#/components/schemas/SlotSearchProposalEnvelope"
        selected_candidate:
          $ref: "#/components/schemas/SlotCandidate"
        patient_id:
          $ref: "#/components/schemas/Uuid"
        patient_name_provisional:
          type: string
        reason:
          type: string
        notes:
          type: string

    SlotSelectionProposalEnvelope:
      type: object
      required:
        - intent
        - safe
        - requires_confirmation
        - autonomy_tier
        - summary
        - selected_candidate
        - warnings
        - blocks
        - audit
      additionalProperties: false
      properties:
        intent:
          const: select_slot_for_create_proposal
        safe:
          type: boolean
        requires_confirmation:
          type: boolean
        autonomy_tier:
          type: string
          enum: [proposal, blocked]
        summary:
          type: string
        selected_candidate:
          $ref: "#/components/schemas/SlotCandidate"
        create_proposal:
          $ref: "#/components/schemas/AppointmentCreateProposalEnvelope"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        candidate_freshness_id:
          type: string
        proposal_freshness_id:
          type: string
        signed_confirmation_evidence:
          $ref: "#/components/schemas/SignedConfirmationEvidence"
        signed_confirmation_evidence_required:
          type: boolean
        session_binding:
          $ref: "#/components/schemas/SessionBinding"
        audit:
          $ref: "#/components/schemas/AuditIntent"

    SlotSearchConstraint:
      type: object
      required: [date_from, date_to, duration_minutes]
      additionalProperties: false
      properties:
        date_from:
          $ref: "#/components/schemas/ClinicDate"
        date_to:
          $ref: "#/components/schemas/ClinicDate"
        time_from:
          $ref: "#/components/schemas/ClinicTime"
        time_to:
          $ref: "#/components/schemas/ClinicTime"
        practitioner_id:
          $ref: "#/components/schemas/Uuid"
        appointment_type_id:
          $ref: "#/components/schemas/Uuid"
        location_id:
          $ref: "#/components/schemas/Uuid"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 480

    SlotCandidate:
      type: object
      required: [candidate_id, appointment_date, start_time_local, start_time, duration_minutes, practitioner_id]
      additionalProperties: false
      properties:
        candidate_id:
          type: string
        appointment_date:
          $ref: "#/components/schemas/ClinicDate"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        start_time:
          $ref: "#/components/schemas/DateTime"
        duration_minutes:
          type: integer
        practitioner_id:
          $ref: "#/components/schemas/Uuid"
        appointment_type_id:
          $ref: "#/components/schemas/Uuid"
        location_id:
          $ref: "#/components/schemas/Uuid"
        summary:
          type: string

    AppointmentConflict:
      type: object
      required: [appointment_id, start_time, end_time, start_time_local, duration_minutes, status]
      additionalProperties: false
      properties:
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        start_time:
          $ref: "#/components/schemas/DateTime"
        end_time:
          $ref: "#/components/schemas/DateTime"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        duration_minutes:
          type: integer
        status:
          type: string
        patient_name:
          type: string

    AppointmentSummary:
      type: object
      required: [id, practice_id, practitioner_id, appointment_date, start_time_local, duration_minutes, status]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        practice_id:
          $ref: "#/components/schemas/Uuid"
        patient_id:
          $ref: "#/components/schemas/Uuid"
        patient_name_provisional:
          type: string
        practitioner_id:
          $ref: "#/components/schemas/Uuid"
        appointment_type_id:
          $ref: "#/components/schemas/Uuid"
        location_id:
          $ref: "#/components/schemas/Uuid"
        appointment_date:
          $ref: "#/components/schemas/ClinicDate"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        start_time:
          $ref: "#/components/schemas/DateTime"
        duration_minutes:
          type: integer
        status:
          type: string

    SessionBinding:
      type: object
      required: [session_id, surface_id, expected_revision, proposal_freshness_id]
      additionalProperties: false
      properties:
        session_id:
          type: string
        surface_id:
          type: string
        expected_revision:
          type: integer
          minimum: 0
        proposal_freshness_id:
          type: string

    ConfirmationAuditEvent:
      type: object
      required:
        - event_id
        - practice_id
        - action
        - actor
        - confirmer
        - occurred_at
        - correlation_id
      additionalProperties: false
      properties:
        event_id:
          type: string
        practice_id:
          $ref: "#/components/schemas/Uuid"
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        action:
          type: string
          enum: [create, update, status_change, delete]
        actor:
          $ref: "#/components/schemas/ActorRef"
        confirmer:
          $ref: "#/components/schemas/ConfirmerRef"
        occurred_at:
          $ref: "#/components/schemas/DateTime"
        correlation_id:
          type: string
        idempotency_key:
          type: string
        evidence:
          type: array
          items:
            type: string

    ConfirmationReceiptVerification:
      type: object
      required:
        - actor_authenticated
        - practice_scope_verified
        - proposal_revalidated
        - conflict_check_passed
        - idempotency_verified
        - audit_recorded
        - signed_evidence_verified
        - visual_diary_check_required
      additionalProperties: false
      properties:
        actor_authenticated:
          type: boolean
        practice_scope_verified:
          type: boolean
        proposal_revalidated:
          type: boolean
        conflict_check_passed:
          type: boolean
        idempotency_verified:
          type: boolean
        audit_recorded:
          type: boolean
        signed_evidence_verified:
          type: boolean
        visual_diary_check_required:
          const: false

    ConfirmationReceipt:
      type: object
      required:
        - schema_version
        - outcome
        - appointment_id
        - patient_display
        - practitioner_display
        - appointment_date
        - start_time_local
        - duration_minutes
        - status
        - confirmed_by_display
        - verification
      additionalProperties: false
      properties:
        schema_version:
          const: appointment.confirmation_receipt.v1
        outcome:
          const: appointment_created
        appointment_id:
          $ref: "#/components/schemas/Uuid"
        patient_display:
          type: string
        practitioner_display:
          type: string
        appointment_date:
          $ref: "#/components/schemas/ClinicDate"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        duration_minutes:
          type: integer
          minimum: 1
        status:
          type: string
        appointment_type:
          type: string
        confirmed_by_display:
          type: string
        confirmed_by_role:
          type: string
        correlation_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: >
            Server-owned appointment command ledger id for the committed create
            transaction. It is not the optional X-Correlation-Id request header.
        audit_event_id:
          $ref: "#/components/schemas/Uuid"
        session_id:
          type: string
          maxLength: 64
        verification:
          $ref: "#/components/schemas/ConfirmationReceiptVerification"

    ReceptionOneProductContextRequest:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - instruction
        - reference_date
        - surface_id
        - correlation_id
        - data_class
      properties:
        contract_version:
          const: reception.one.product-context-request.v1
        instruction:
          type: string
          minLength: 1
          maxLength: 512
        reference_date:
          $ref: "#/components/schemas/ClinicDate"
        surface_id:
          type: string
          minLength: 1
          maxLength: 100
        correlation_id:
          type: string
          minLength: 3
          maxLength: 100
        data_class:
          const: authored_synthetic
        planner_mode:
          type: string
          enum: [deterministic, isolated_vertex]
          default: deterministic
        selected_appointment_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    ReceptionOneProductContextSlot:
      type: object
      additionalProperties: false
      required:
        - slot_handle
        - appointment_date
        - start_time_local
        - duration_minutes
        - warning_codes
      properties:
        slot_handle:
          type: string
          pattern: "^synthetic-[a-z0-9][a-z0-9-]{2,95}$"
        appointment_date:
          $ref: "#/components/schemas/ClinicDate"
        start_time_local:
          $ref: "#/components/schemas/ClinicTime"
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 180
        warning_codes:
          type: array
          maxItems: 8
          items:
            type: string

    ReceptionOneProductContextReview:
      type: object
      additionalProperties: false
      required:
        - disposition
        - operator_ids
        - safe_repairs
        - violation_paths
        - context_revision
      properties:
        disposition:
          type: string
          enum: [admit, revision_required, clarification_required, reject]
        plan_hash:
          type: [string, "null"]
        operator_ids:
          type: array
          maxItems: 12
          items:
