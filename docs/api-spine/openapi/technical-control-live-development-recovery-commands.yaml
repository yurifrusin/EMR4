openapi: 3.1.0
info:
  title: EMR4 Bureau C5 Technical Control Live-Development-Recovery Commands (not_mounted)
  version: 0.1.0
  summary: Declarative documentation of a future single-purpose REST ownership.
  description: >
    This document is a declarative OpenAPI-shaped command contract ONLY. It is
    explicitly `not_mounted`: it registers no FastAPI route, imports nothing
    into `app.main`, claims no existing route, and exposes no runtime surface.
    The Bureau C5 foundation is implementation-readiness code that starts no
    process, binds or connects no socket, allocates no port, creates or removes
    no directory, invokes no provider and performs no live rehearsal. A later
    real command route or live recovery sequence requires a separate exact
    descendant after the deterministic and independent gates pass.
x-emr4-current-backend-alignment:
  status: not_mounted_documentation_only
  mounted: false
  imported_by_app_main: false
  claims_no_existing_route: true
  evidence_label: provider_free_authored_synthetic_c5_implementation_readiness
  source_plan: docs/emr4-model-required-bureau-c5-disposable-live-development-recovery-plan.md
  forward_runbook: start-c5-disposable-service.v1
  rollback_runbook: stop-c5-disposable-service.v1
  target_environment: c5_disposable_authored_synthetic
  target_kind: task_owned_loopback_http_service
  target_id: synthetic:c5-recovery-target
  bind_host: 127.0.0.1
  future_mounted_command_requirements:
    status: separately_deferred
    requires_new_authority: true
    fields:
      - authenticated_actor
      - practice_scope
      - transport_idempotency
      - durable_audit_metadata
    current_contract_implication: none
servers: []
tags:
  - name: TechnicalControlLiveDevelopmentRecovery
    description: Future single-purpose live-development-recovery command ownership (documentation only, not mounted).
paths: {}
components:
  schemas:
    Target:
      type: object
      additionalProperties: false
      required: [environment, kind, target_id]
      properties:
        environment: {const: c5_disposable_authored_synthetic}
        kind: {const: task_owned_loopback_http_service}
        target_id: {const: "synthetic:c5-recovery-target"}
    OperationCounters:
      type: object
      additionalProperties: false
      required:
        - process_starts
        - process_stops
        - socket_binds
        - socket_connects
        - port_allocations
        - directory_creates
        - directory_removals
        - provider_calls
        - database_operations
        - product_operations
        - cloud_iam_operations
        - deployment_operations
        - external_event_operations
        - protected_operations
        - shell_operations
        - sql_operations
        - network_operations
        - dynamic_import_operations
        - eval_exec_operations
        - reflection_operations
      properties:
        process_starts: {type: integer, minimum: 0}
        process_stops: {type: integer, minimum: 0}
        socket_binds: {type: integer, minimum: 0}
        socket_connects: {type: integer, minimum: 0}
        port_allocations: {type: integer, minimum: 0}
        directory_creates: {type: integer, minimum: 0}
        directory_removals: {type: integer, minimum: 0}
        provider_calls: {type: integer, minimum: 0}
        database_operations: {type: integer, minimum: 0}
        product_operations: {type: integer, minimum: 0}
        cloud_iam_operations: {type: integer, minimum: 0}
        deployment_operations: {type: integer, minimum: 0}
        external_event_operations: {type: integer, minimum: 0}
        protected_operations: {type: integer, minimum: 0}
        shell_operations: {type: integer, minimum: 0}
        sql_operations: {type: integer, minimum: 0}
        network_operations: {type: integer, minimum: 0}
        dynamic_import_operations: {type: integer, minimum: 0}
        eval_exec_operations: {type: integer, minimum: 0}
        reflection_operations: {type: integer, minimum: 0}
    LiveRecoveryCommandEnvelope:
      description: Backend-owned closed command envelope (documentation only, not mounted).
      type: object
      additionalProperties: false
      required:
        - schema_version
        - evidence_label
        - runbook_id
        - rollback_runbook_id
        - target
        - host
        - port
        - generation
        - target_nonce
        - artifact_sha256
        - python_executable_sha256
        - frame_digest
        - candidate_digest
        - proofreader_digest
        - provider_admission_digest
        - command_material_sha256
        - parameters
        - approval_binding
        - evidence_binding
        - idempotency_key
        - correlation_id
        - issued_at
        - readback_contract
      properties:
        schema_version: {const: emr4.live_recovery_command_envelope.v1}
        evidence_label: {const: occupied_authored_synthetic_disposable_live_development_recovery}
        runbook_id: {const: start-c5-disposable-service.v1}
        rollback_runbook_id: {const: stop-c5-disposable-service.v1}
        target: {$ref: "#/components/schemas/Target"}
        host: {const: 127.0.0.1}
        port:
          type: integer
          minimum: 1
          maximum: 65535
        generation: {const: 2}
        target_nonce: {type: string, pattern: "^[0-9a-f]{32,64}$"}
        artifact_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        python_executable_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        frame_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        candidate_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        proofreader_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        provider_admission_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        command_material_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        parameters:
          type: object
          maxProperties: 0
          additionalProperties: false
        approval_binding:
          type: object
          additionalProperties: false
          required: [approval_id, approval_sha256, plan_sha256]
          properties:
            approval_id: {type: string, format: uuid}
            approval_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            plan_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        evidence_binding:
          type: object
          additionalProperties: false
          required: [evidence_id, reference_sha256]
          properties:
            evidence_id: {type: string, format: uuid}
            reference_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        idempotency_key: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
        issued_at: {type: string, format: date-time}
        readback_contract:
          type: object
          additionalProperties: false
          required: [host, port, generation, state, artifact_sha256, target_nonce]
          properties:
            host: {const: 127.0.0.1}
            port: {type: integer, minimum: 1, maximum: 65535}
            generation: {const: 2}
            state: {const: healthy}
            artifact_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            target_nonce: {type: string, pattern: "^[0-9a-f]{32,64}$"}
    LiveRecoveryAttemptReceipt:
      description: Bounded terminal success receipt released only after a distinct fresh process and loopback HTTP readback.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - evidence_label
        - result
        - runbook_id
        - target
        - generation
        - state
        - artifact_sha256
        - python_executable_sha256
        - port
        - target_nonce
        - process_observation_id
        - http_readback_observation_id
        - command_material_sha256
        - attempt_evidence_sha256
        - rollback
        - operation_counters
        - issued_at
      properties:
        schema_version: {const: emr4.live_recovery_attempt_receipt.v1}
        evidence_label: {const: occupied_authored_synthetic_disposable_live_development_recovery}
        result: {const: live_development_recovery_verified}
        runbook_id: {const: start-c5-disposable-service.v1}
        target: {$ref: "#/components/schemas/Target"}
        generation: {const: 2}
        state: {const: healthy}
        artifact_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        python_executable_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        port: {type: integer, minimum: 1, maximum: 65535}
        target_nonce: {type: string, pattern: "^[0-9a-f]{32,64}$"}
        process_observation_id: {type: string, pattern: "^obs-[a-z0-9-]+$"}
        http_readback_observation_id: {type: string, pattern: "^obs-[a-z0-9-]+$"}
        command_material_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        attempt_evidence_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        rollback:
          type: object
          additionalProperties: false
          required: [invoked, verified]
          properties:
            invoked: {const: false}
            verified: {type: [boolean, "null"]}
        operation_counters: {$ref: "#/components/schemas/OperationCounters"}
        issued_at: {type: string, format: date-time}
    CleanupReceipt:
      description: Bounded cleanup receipt proving no owned process, listener, task directory, open ledger or reusable capability remains.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - evidence_label
        - result
        - no_process
        - no_listener
        - no_task_directory
        - no_open_ledger
        - no_reusable_capability
        - removed_paths
        - ledger_consumed
        - operation_counters
        - issued_at
      properties:
        schema_version: {const: emr4.cleanup_receipt.v1}
        evidence_label: {const: occupied_authored_synthetic_disposable_live_development_recovery}
        result: {enum: [cleanup_verified, cleanup_inconclusive]}
        no_process: {type: boolean}
        no_listener: {type: boolean}
        no_task_directory: {type: boolean}
        no_open_ledger: {type: boolean}
        no_reusable_capability: {type: boolean}
        removed_paths:
          type: array
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 512}
        ledger_consumed: {type: boolean}
        operation_counters: {$ref: "#/components/schemas/OperationCounters"}
        issued_at: {type: string, format: date-time}
security: []
