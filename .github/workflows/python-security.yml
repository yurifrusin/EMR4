name: Python Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Daily at 04:17 Australia/Brisbane (18:17 UTC).
    - cron: "17 18 * * *"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned verification tools
        run: pip install -r requirements-dev.txt

      - name: Canonical Python 3.11 correctness and lint gates
        run: python scripts/verify_repository.py --profile ci-correctness

      - name: Dependency CVE scan (pip-audit)
        # Fails when known CVEs are found in requirements.txt.
        # To clear a finding after verifying it is not reachable or after
        # upgrading the dep, use: pip-audit -r requirements.txt --ignore-vuln <GHSA-ID>
        run: pip-audit -r requirements.txt --desc

      - name: Static security analysis (Bandit)
        if: ${{ always() }}
        # Runs the exact reviewed baseline through the canonical entry point.
        run: python scripts/verify_repository.py --profile ci-bandit
