name: Node & Office Add-in Security Baseline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Daily at 04:47 Australia/Brisbane (18:47 UTC).
    - cron: "47 18 * * *"

permissions:
  contents: read

jobs:
  security-check:
    name: Run Manifest Validation & Security Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "EMR4 Sidebar/package-lock.json"

      - name: Install Dependencies
        run: npm ci
        working-directory: "./EMR4 Sidebar"

      - name: Run Manifest Validation (Blocking)
        run: npm run validate
        working-directory: "./EMR4 Sidebar"

      - name: Run Production Dependency Security Audit (Blocking)
        run: npm audit --omit=dev
        working-directory: "./EMR4 Sidebar"

      - name: Run Build-Tool / DevDependency Security Audit (Non-Blocking)
        run: npm audit || true
        working-directory: "./EMR4 Sidebar"
