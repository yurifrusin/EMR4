id: interpret_visible_diary_date_context
category: booking_interpret_contract
description: >
  A partial request that names patient, practitioner, time, and duration can use
  the visible diary page date as explicit context, with a reversible assumption.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera at 09:00 for 20 minutes"
      context_frames:
        - type: visible_diary_page
          visible_date: "2026-07-16"
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-16"
        "normalization.constraint.date_from": "2026-07-16"
        "assumptions.0.field": date_from

expected:
  appointment_written: false
  audit_written: false

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
