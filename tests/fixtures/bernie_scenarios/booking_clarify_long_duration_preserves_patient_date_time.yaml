id: booking_clarify_long_duration_preserves_patient_date_time
category: booking_clarification
reference_date: 2026-07-05
initial_state:
  diary_date: 2026-07-05
  practice: emr4_dev_main
turns:
  - user: "I need to book Margaret Thompson in next Tuesday at 3:30 for a long appointment"
    expect:
      outcome: clarification_required
      missing: ["duration_minutes"]
      preserved:
        patient: "Margaret Thompson"
        date: "2026-07-14"
        time: "15:30"
  - user: "That will be 30 minutes"
    expect:
      outcome: confirmation_ready
      preserved:
        patient: "Margaret Thompson"
        date: "2026-07-14"
        time: "15:30"
        duration_minutes: 30
forbidden:
  - "lose patient identity"
  - "lose date or time"
  - "mutate the diary before confirmation"
xfail:
  reason: "Clarification turns lose resolved patient and temporal frame fields. Fix scheduled for Sprint R2."
