id: interpret_context_practitioner_override
category: booking_interpret_contract
description: >
  A follow-up practitioner change wins over threaded context while preserving
  the patient, date, time, and duration from the prior requested appointment.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - other_practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 09:00 for 20 minutes"
      context_frames: []
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "20"
  - action: interpret
    input:
      instruction: "Actually with Dr Patel please"
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{other_practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "20"
        "assumptions.0.field": clarification_merge

expected:
  appointment_written: false
  audit_written: false

preserved_fields:
  - command_candidate.patient_id
  - command_candidate.date_from
  - command_candidate.earliest_time
  - command_candidate.duration_minutes

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
