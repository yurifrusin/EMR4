id: interpret_change_duration_new_reply_wins
category: booking_interpret_contract
description: >
  A follow-up duration change wins while the threaded patient, practitioner,
  date, and time stay intact.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 09:00 for 20 minutes"
    expect:
      status: 200
      fields:
        result: interpreted
        "command_candidate.duration_minutes": "20"
  - action: interpret
    input:
      instruction: "Actually make it 45 minutes"
    expect:
      status: 200
      fields:
        result: interpreted
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "45"

expected:
  appointment_written: false
  audit_written: false

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written

