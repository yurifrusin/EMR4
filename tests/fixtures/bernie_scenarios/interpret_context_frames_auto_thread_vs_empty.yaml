id: interpret_context_frames_auto_thread_vs_empty
category: booking_interpret_contract
description: >
  Omitted context_frames auto-threads the prior requested appointment frame,
  while explicit context_frames: [] clears that context and asks again.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 09:00 for 20 minutes"
      context_frames: []
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "20"
  - action: interpret
    input:
      instruction: "Actually make it 09:30"
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:30"
        "command_candidate.duration_minutes": "20"
        "assumptions.0.field": clarification_merge
  - action: interpret
    input:
      instruction: "Actually make it 10:00"
      context_frames: []
    expect:
      status: 200
      fields:
        result: clarification_required
        safe: false
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": null
        "command_candidate.practitioner_id": null
        "command_candidate.date_from": null
        "command_candidate.earliest_time": "10:00"
        "missing_fields.0": practitioner_id
        "missing_fields.1": date_from

expected:
  appointment_written: false
  audit_written: false

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written

