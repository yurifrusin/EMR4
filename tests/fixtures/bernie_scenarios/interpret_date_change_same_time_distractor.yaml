id: interpret_date_change_same_time_distractor
category: booking_interpret_contract
description: >
  A follow-up changing the date with "at the same time" wording preserves the
  threaded time without claiming anaphoric resolution. "Same time" is inert in
  the fake interpreter; prior earliest_time carries through route threading.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 11:00 for 20 minutes"
      context_frames: []
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "11:00"
        "command_candidate.duration_minutes": "20"
        "normalization.constraint.date_from": "2026-07-14"
        "normalization.constraint.earliest_time": "11:00:00"
        "normalization.constraint.duration_minutes": 20
  - action: interpret
    input:
      instruction: "Actually make it next Wednesday at the same time"
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-15"
        "command_candidate.earliest_time": "11:00"
        "command_candidate.duration_minutes": "20"
        "normalization.constraint.date_from": "2026-07-15"
        "normalization.constraint.earliest_time": "11:00:00"
        "normalization.constraint.duration_minutes": 20
        "assumptions.0.field": clarification_merge

expected:
  appointment_written: false
  audit_written: false

preserved_fields:
  - command_candidate.patient_id
  - command_candidate.practitioner_id
  - command_candidate.earliest_time
  - command_candidate.duration_minutes
  - normalization.constraint.earliest_time
  - normalization.constraint.duration_minutes

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
