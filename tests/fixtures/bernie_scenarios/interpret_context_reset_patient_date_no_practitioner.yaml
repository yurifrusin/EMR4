id: interpret_context_reset_patient_date_no_practitioner
category: booking_interpret_contract
description: >
  After a complete prior request, explicit context reset with patient and a
  relative date must not inherit practitioner, time, or duration from the prior
  requested appointment.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 09:00 for 20 minutes"
      reference_date: "2026-07-08"
      context_frames: []
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "20"
        "request_reference_date": "2026-07-08"
  - action: interpret
    input:
      instruction: "Book Margaret Thompson tomorrow"
      reference_date: "2026-07-09"
      context_frames: []
    expect:
      status: 200
      fields:
        result: clarification_required
        safe: false
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": null
        "command_candidate.date_from": tomorrow
        "command_candidate.earliest_time": null
        "command_candidate.duration_minutes": 15
        "request_reference_date": "2026-07-09"
        "normalization.safe": false
        "missing_fields.0": practitioner_id
        "clarifying_question": "Did you forget to mention the doctor or nurse?"

expected:
  appointment_written: false
  audit_written: false

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
