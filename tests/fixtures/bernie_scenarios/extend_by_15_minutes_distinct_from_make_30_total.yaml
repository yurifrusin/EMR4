id: extend_by_15_minutes_distinct_from_make_30_total
category: appointment_extension
reference_date: 2026-07-05
initial_state:
  diary_date: 2026-07-05
  practice: emr4_dev_main
  seeded_appointments:
    - id: "apt_1"
      patient: "Margaret Thompson"
      practitioner: "Dr Shera"
      date: "2026-07-05"
      time: "10:00"
      duration_minutes: 15
      status: "confirmed"
turns:
  - user: "Extend Margaret Thompson's 10:00 appointment by 15 minutes"
    expect:
      outcome: confirmation_ready
      action: "extend"
      preserved:
        appointment_id: "apt_1"
        duration_minutes: 30
  - user: "Actually, make it 45 minutes total"
    expect:
      outcome: confirmation_ready
      action: "update"
      preserved:
        appointment_id: "apt_1"
        duration_minutes: 45
forbidden:
  - "create a new appointment instead of extending or updating existing"
  - "set duration to 60 minutes on first turn (adding total instead of offset)"
