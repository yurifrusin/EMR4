id: booking_seeded_exact_duplicate
category: booking_confirmation
description: >
  Prove that allowlisted seeded diary state participates in the real supervised
  booking classifier while remaining outside scenario write deltas.
reference_date: "2026-07-13"

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule
  simulated_clinic_time: "08:00"
  seeded_appointments:
    - id: existing-booking
      patient: Margaret Thompson
      practitioner: Dr Shera
      date: "2026-07-14"
      time: "15:00"
      duration_minutes: 15
      status: Booked
      reason: "Existing standard appointment"

turns:
  - action: supervise
    input:
      command:
        practitioner_id: "{practitioner_id}"
        patient_id: "{patient_id}"
        date_from: "2026-07-14"
        date_to: "2026-07-14"
        earliest_time: "15:00"
        latest_time: "16:30"
        duration_minutes: 15
      patient_id: "{patient_id}"
    expect:
      status: 200
      appointment_delta: 0
      audit_delta: 0
      fields:
        result: existing_booking_found
        safe: true
        requires_confirmation: false
        "staff_review.confirmation_ready": false
        "staff_review.confirm_endpoint": null
        "staff_review.confirm_payload": null
        "existing_booking.appointment_date": "2026-07-14"
        "existing_booking.start_time_local": "15:00:00"

expected:
  appointment_written: false
  audit_written: false

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
