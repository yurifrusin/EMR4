id: interpret_reference_date_change_no_relative_wording
category: booking_interpret_contract
description: >
  A follow-up turn with a changed reference date but no date wording must keep
  the auto-threaded absolute appointment date while applying the current time
  change.
reference_date: 2026-07-08

initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule

turns:
  - action: interpret
    input:
      instruction: "Book Margaret Thompson with Dr Shera next Tuesday at 09:00 for 20 minutes"
      reference_date: "2026-07-08"
      context_frames: []
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "09:00"
        "command_candidate.duration_minutes": "20"
        "request_reference_date": "2026-07-08"
        "normalization.constraint.date_from": "2026-07-14"
  - action: interpret
    input:
      instruction: "Actually make it at 10:00"
      reference_date: "2026-07-09"
    expect:
      status: 200
      fields:
        result: interpreted
        safe: true
        "provider_metadata.provider": fake
        "provider_metadata.live_provider": false
        "command_candidate.patient_id": "{patient_id}"
        "command_candidate.practitioner_id": "{practitioner_id}"
        "command_candidate.date_from": "2026-07-14"
        "command_candidate.earliest_time": "10:00"
        "command_candidate.duration_minutes": "20"
        "request_reference_date": "2026-07-09"
        "normalization.constraint.date_from": "2026-07-14"

expected:
  appointment_written: false
  audit_written: false

preserved_fields:
  - command_candidate.patient_id
  - command_candidate.practitioner_id
  - command_candidate.date_from
  - command_candidate.duration_minutes

forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
