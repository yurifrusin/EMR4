id: booking_overlap_not_exact_duplicate
category: booking_confirmation
description: >
  Prove that an appointment created mid-scenario by an external fixture event
  participates in the existing-booking classifier without being seeded before
  replay. The supervise step finds the external appointment as an exact match.
reference_date: "2026-07-14"
initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule
  simulated_clinic_time: "08:00"
turns:
  - action: external_appointment
    input:
      operation: create
      patient: Margaret Thompson
      practitioner: Dr Shera
      date: "2026-07-15"
      time: "15:00"
      duration_minutes: 15
      status: Booked
    expect:
      appointment_delta: 0
      audit_delta: 0
      fields:
        result: fixture_applied
  - action: supervise
    input:
      command:
        practitioner_id: "{practitioner_id}"
        patient_id: "{patient_id}"
        date_from: "2026-07-15"
        date_to: "2026-07-15"
        earliest_time: "15:00"
        latest_time: "16:30"
        duration_minutes: 15
      patient_id: "{patient_id}"
    expect:
      status: 200
      appointment_delta: 0
      audit_delta: 0
      fields:
        result: existing_booking_found
        safe: true
        requires_confirmation: false
        "staff_review.confirmation_ready": false
        "staff_review.confirm_endpoint": null
        "staff_review.confirm_payload": null
        "existing_booking.appointment_date": "2026-07-15"
        "existing_booking.start_time_local": "15:00:00"
expected:
  appointment_written: false
  audit_written: false
forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
