id: booking_overlap_not_exact_duplicate
category: booking_confirmation
description: >
  Prove that an appointment created mid-scenario by an external fixture event
  overlaps the requested slot without being an exact duplicate. The existing
  booking starts before the requested window and has a different duration, so
  it must not trigger existing_booking_found and slot search must move onward.
reference_date: "2026-07-14"
initial_state:
  fixtures:
    - practice
    - practitioner
    - gp_user
    - patient
    - schedule
  simulated_clinic_time: "08:00"
turns:
  - action: external_appointment
    input:
      operation: create
      patient: Margaret Thompson
      practitioner: Dr Shera
      date: "2026-07-15"
      time: "14:50"
      duration_minutes: 30
      status: Booked
    expect:
      appointment_delta: 0
      audit_delta: 0
      fields:
        result: fixture_applied
  - action: supervise
    input:
      command:
        practitioner_id: "{practitioner_id}"
        patient_id: "{patient_id}"
        date_from: "2026-07-15"
        date_to: "2026-07-15"
        earliest_time: "15:00"
        latest_time: "16:30"
        duration_minutes: 15
      patient_id: "{patient_id}"
      selected_candidate_index: 0
    expect:
      status: 200
      appointment_delta: 0
      audit_delta: 0
      fields:
        result: confirmation_ready
        safe: true
        requires_confirmation: true
        "staff_review.confirmation_ready": true
        "staff_review.selected_slot.start_time_local": "15:30:00"
        "existing_booking": null
expected:
  appointment_written: false
  audit_written: false
forbidden_outcomes:
  - provider_called
  - appointment_written
  - audit_written
