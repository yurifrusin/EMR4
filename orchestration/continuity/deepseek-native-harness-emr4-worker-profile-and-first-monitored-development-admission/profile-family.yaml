schema_version: emr4.deepseek-native-harness-profile-family.v2
package:
  name: "@deepseek-ai/dsh"
  version: 0.1.0-rc.7
  registry_shasum: 8a69013c06179d7af437de92fb4a9a2e1fd7d410
  registry_integrity: sha512-ZceDCJ8FAywih+USW/OMk9jEhunlvJBGEz4kqrhau23hPzbciOazZrywH0nBRsaalSeAJ1JGBmjtw4OSjToStw==
tool_view_enforcement:
  selector:
    package: "@deepseek-ai/dsh-tools"
    version: 0.1.0-rc.7
    public_api: ctx.tools.restrict
    allow_argument: selected_profile.tools
    applied_scope: agent_setup_context
  preset_mount:
    package: "@deepseek-ai/dsh-agent-presets"
    version: 0.1.0-rc.7
    public_api: ctx.agentPresets.mount
    preset_id: selected_profile_name
    mount_phase: agents.create_setup_before_first_request
  semantics:
    model_request_effect: remove_unselected_tool_schemas
    unnamed_late_global_tools: excluded
    multiple_restrictions: intersection
    unknown_local_or_reserved_names: reject
    security_boundary: false
  outer_broker:
    required: true
    tool_allowlist_source: selected_profile.tools
    exact_match_required: true
  source_mapping:
    - package: "@deepseek-ai/dsh-tools"
      path: README.md
      sha256: 695e1f49dc4929133a5bca9da0d1f96601027a2643159efff5b82fb2709aa90d
    - package: "@deepseek-ai/dsh-tools"
      path: lib/index.js
      sha256: 47de95d14493dbd22d1a3ade14890fc99d7232db4e363f2190c9063b030dd029
    - package: "@deepseek-ai/dsh-agent-presets"
      path: README.md
      sha256: c9fdecbd3d6047f171f0e0a6208b31fe38891685e9fdee86a46d5d7effcd7733
    - package: "@deepseek-ai/dsh-agent-presets"
      path: lib/index.js
      sha256: a0b417514e3d285ad5fef74867e8049af333ebdec6e4d7639e388aa0903e0039
model_route:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoning_effort: high
  endpoint_authority: isolated_broker_sidecar_allowlisted_deepseek_official
loop_control:
  automatic_retries: 0
  fallbacks: []
  max_parallel_tool_calls: 1
  wall_clock_seconds: 900
  monetary_boundary: operator_prepaid_account
session_policy:
  fresh_session_by_default: true
  profile_pinned_for_session: true
  resume_same_operation_only: true
  terminal_session_not_resumable: true
  binding_fields:
    - operation_id
    - source_head
    - worktree
    - owned_paths
    - forbidden_surfaces
    - focused_tests
execution_enclosure:
  image: node@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
  host_filesystem_visibility: exact_sparse_worktree_bind_only
  worker_network: internal_broker_only_no_direct_egress
  provider_credential_holder: isolated_broker_sidecar
  worker_provider_credential: forbidden
  worker_broker_capability: required_at_process_start
  broker_provider_call_budget: none_beyond_single_session_wall_clock_and_prepaid_balance
  model_facing_shell: disabled_for_first_monitored_development
  focused_test_executor: sol_outside_worker_container
evidence_policy:
  raw_session_location: disposable_harness_home_only
  raw_session_commit: forbidden
  retained_evidence: sanitized_structural_metadata_only
  required_fields:
    - package_identity
    - profile_digest
    - session_id
    - process_terminal
    - model_usage_totals
    - ordered_tool_metadata
    - changed_paths
    - focused_test_result
    - cleanup_readback
    - broker_request_metadata
    - enclosure_readback
  forbidden_retention:
    - raw_reasoning
    - provider_request_body
    - provider_response_body
    - raw_tool_payload
    - credential
    - environment_dump
disabled_surfaces:
  - bash
  - jobs
  - skills
  - goals
  - todo
  - ralph
  - subagents
  - workflows
  - web
  - browser
  - mcp
  - acp
  - code_runtime
  - compaction_model
  - session_title_model
  - telemetry
  - pi_ai_routes
  - pwsh
profiles:
  emr4-provider-free-preflight:
    occupied: false
    purpose: validate_package_profile_and_tool_composition_before_provider_io
    permission:
      sandbox: read-only
      approval: never
    tools: []
    credential_policy: intentionally_absent
    expected_pre_provider_terminal: MISSING_CREDENTIAL
    max_output_tokens: 64
    allowed_resume: never
  emr4-readonly-review:
    occupied: true
    purpose: bounded_repository_local_readonly_review
    permission:
      sandbox: read-only
      approval: never
    tools:
      - read
      - glob
    credential_policy: broker_capability_only
    expected_pre_provider_terminal: null
    max_output_tokens: 4096
    allowed_resume: same_operation_only
  emr4-bounded-worker:
    occupied: true
    purpose: exact_packet_repository_local_implementation_and_focused_tests
    permission:
      sandbox: workspace-write
      approval: never
    tools:
      - read
      - glob
      - edit
    credential_policy: broker_capability_only
    expected_pre_provider_terminal: null
    max_output_tokens: 4096
    allowed_resume: same_operation_only
