schema_version: ariadne.role_preferences.v1
roles:
  - role: conductor
    required: true
    preferences: [deepseek-pro-conductor-fallback, claude-fable-conductor, claude-opus-conductor, gpt-sol-conductor-fallback]
    preference_rationale: DeepSeek 4 Pro is the routine Conductor. Fable and then Opus are escalation resources for programme boundaries, architecture disputes, material product policy, or repeated sprint failure; a distinct GPT Sol subagent is fourth. The protected orchestrator session never fills the fallback directly.
    review_by: 2026-08-11
  - role: verifier
    required: false
    preferences: [deepseek-flash-verifier, openai-primary-orchestrator]
    preference_rationale: Deterministic checks are always required; an independent LLM verifier is reserved for authority, ambiguity, disagreement, or drift-risk triggers.
    review_by: 2026-08-11
  - role: orchestrator
    required: true
    preferences: [openai-primary-orchestrator]
    preference_rationale: The protected primary integration resource owns master.
    review_by: 2026-08-11
