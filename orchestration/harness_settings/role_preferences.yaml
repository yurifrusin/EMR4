schema_version: ariadne.role_preferences.v1
roles:
  - role: conductor
    required: true
    preferences: [claude-fable-conductor, claude-opus-conductor, deepseek-pro-conductor-fallback, gpt-sol-conductor-fallback]
    preference_rationale: Fable is default; Opus follows on real Claude usage or availability limits; DeepSeek 4 Pro via Deep Code provides cross-provider continuity until Claude refills; a distinct GPT Sol subagent is fourth. The protected orchestrator session never fills the fallback directly.
    review_by: 2026-08-11
  - role: verifier
    required: false
    preferences: [deepseek-flash-verifier, openai-primary-orchestrator]
    preference_rationale: Deterministic checks are always required; an independent LLM verifier is reserved for authority, ambiguity, disagreement, or drift-risk triggers.
    review_by: 2026-08-11
  - role: orchestrator
    required: true
    preferences: [openai-primary-orchestrator]
    preference_rationale: The protected primary integration resource owns master.
    review_by: 2026-08-11
