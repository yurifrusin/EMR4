schema_version: ariadne.role_preferences.v1
roles:
  - role: conductor
    required: false
    preferences: [deepseek-pro-conductor-fallback, claude-fable-conductor, claude-opus-conductor, gpt-sol-conductor-fallback]
    preference_rationale: Sol decides whether independent Conductor consultation is warranted. DeepSeek 4 Pro is the economical first consultant; Fable and Opus are reserved for programme boundaries, architecture disputes, material product policy, or repeated sprint failure. Routine bounded sprints do not require a Conductor.
    review_by: 2026-08-11
  - role: verifier
    required: false
    preferences: [deepseek-flash-verifier, openai-primary-orchestrator]
    preference_rationale: Deterministic checks are always required; an independent LLM verifier is reserved for authority, ambiguity, disagreement, or drift-risk triggers.
    review_by: 2026-08-11
  - role: orchestrator
    required: true
    preferences: [openai-primary-orchestrator]
    preference_rationale: The protected Sol resource owns tranche direction, chooses the planning mode, and alone integrates protected master.
    review_by: 2026-08-11
