schema_version: ariadne.verifier_execution_policy.v1
purpose: deterministic_first_risk_triggered_independent_verification
execution_order:
  - verifier_worktree_preflight
  - five_source_rehydration_receipt
  - exact_authority_and_scope_packet
  - exact_non_protected_candidate_binding
  - settings_fingerprint_match
  - focused_tests
  - static_and_filesystem_checks
  - clean_candidate_precondition
  - risk_trigger_decision
  - independent_model_review_when_triggered
  - exact_single_decision_admission
  - clean_unchanged_candidate_postcondition
deterministic_gate:
  required_before_external_model_dispatch: true
  fail_closed_action: no_external_model_call
  required_results:
    verifier_worktree_preflight: passed
    five_source_rehydration_receipt: passed
    authority_and_scope_packet: complete
    candidate_branch: exact_non_protected
    candidate_head: exact
    settings_fingerprint: exact
    focused_tests: passed
    static_and_filesystem_checks: passed
    candidate_worktree: clean
external_verifier:
  mode: risk_triggered_optional
  preferred_resource_id: antigravity-gemini-flash-3-7-high-verifier
  model: gemini-3.7-flash-high
  reasoning: high
  project_context: fresh
  worktree_access: exact_bound_read_only
  candidate_prior_review_artifacts: excluded
  silent_model_fallback: forbidden
  implementation_capability: forbidden
  decision_contract:
    allowed: [pass, revision_required]
    exact_terminal_decision_count: 1
    envelope_format: schema_constrained_json
    additional_properties: forbidden
    legacy_terminal_line_default: false
    optional_command_manifest:
      schema_version: ariadne.verifier-command-manifest.v1
      representation: ordered_structured_argv
      exact_results_required: true
      pass_requires_every_exit_code_zero: true
      manifest_digest_in_receipt: true
  postcondition:
    candidate_head: unchanged
    candidate_worktree: clean
  environment_boundary:
    exact_existing_interpreter_required: true
    package_or_environment_bootstrap: forbidden
    missing_dependency_action: stop_and_report
  triggers:
    - security_control_change
    - new_security_write_deployment_or_release_authority
    - recovered_material_change
    - conductor_orchestrator_material_disagreement
    - ambiguous_mandate_or_scope_boundary
    - resource_limit_exception
    - authority_or_ownership_drift_signal
lane_profile:
  sol:
    resource_id: openai-primary-orchestrator
    routine_reasoning: high
    material_reasoning: extra_high
    owns:
      - architecture
      - authority_and_scope
      - acceptance
      - recovery
      - integration
    material_triggers:
      - architecture_or_acceptance_meaning
      - authority_or_product_policy
      - privacy_or_security_boundary
      - provider_cloud_production_or_release
      - contradictory_or_incomplete_evidence
  deepseek_flash:
    resource_id: deepseek-flash-workers
    model: deepseek-v4-flash
    reasoning: high
    transport: claude_code_bare
    owns:
      - bounded_separable_implementation
      - mechanical_test_artifact
      - deterministic_fixture_regeneration
      - contained_repair
    may_not:
      - architecture
      - acceptance
      - integration
      - protected_refs
      - package_or_shared_environment_mutation
    environment_boundary:
      inherited_virtual_environment_and_package_indexes: removed
      pip_and_uv_network_install: disabled
      package_manager_instruction: forbidden
      missing_dependency_action: stop_and_report
  gemini_flash:
    resource_id: antigravity-gemini-flash-3-7-high-verifier
    model: gemini-3.7-flash-high
    reasoning: high
    transport: antigravity_fresh_project
    owns:
      - fresh_independent_code_review
      - adversarial_security_review
      - independent_test_design
    may_not:
      - implementation
      - self_acceptance
      - integration
      - baton
      - protected_refs
dispatch_economy:
  dispatch_is_optional: true
  require_leverage_greater_than_packet_monitoring_and_recovery_cost: true
  keep_serial_tightly_coupled_or_small_work_sol_owned: true
evidence_led_flow:
  policy: evidence_led_workflow.yaml
  one_active_boundary_and_one_final_risk_triggered_veto: true
  coordinate_is_not_assertion: true
  correction_requires_discriminating_next_observation: true
  continuation_event_values_are_cli_discoverable: true
  repeated_same_coordinate_after_correction: stop_or_change_programme_direction
test_execution:
  repository_conftest_pytest: serial
  shared_postgresql_schema: serial
  required_validation_runner: ../../scripts/ariadne_validation_runner.py
  validation_runner_manifest: ordered_structured_argv
  validation_runner_lifecycle_receipt: atomic_and_durable
  validation_runner_failure_behavior: stop_on_first_nonzero
  required_pytest_launcher: ../../scripts/ariadne_serial_pytest.py
  conftest_enforcement: ../../tests/conftest.py
  direct_pytest: forbidden
  serial_noconftest: forbidden
  selected_test_paths: exact_existing_repository_paths
  direct_pytest_bypass: serialized_by_repository_conftest
  parallel_allowed_only_for:
    - import_free_static_checks
    - filesystem_only_checks
    - isolated_browser_checks_without_shared_mutable_runtime
incident_learning:
  register: ../continuity/ariadne-agent-error-register/agent-error-register.json
  schema: ../continuity/ariadne-agent-error-register/agent-error-register.schema.json
  deterministic_report: ../../scripts/ariadne_agent_error_register.py
  register_before_corrected_attempt_acceptance: true
  record_when:
    - independent_review_rejected_for_agent_behavior
    - candidate_worktree_postcondition_failed
    - exact_command_scope_failed
    - evidence_narrative_conflicted_with_preserved_evidence
    - worker_transport_failed_without_nontransferable_closeout
    - shared_postgresql_pytest_serialization_collision
    - reviewer_environment_or_dependency_mutation
  origin_classes:
    - agent_behavior
    - transport
    - harness
    - repository
    - operator
  controls:
    immutable_failure_evidence: required
    correction_linkage: required
    recurrence_threshold: 2
    raw_prompts_secrets_and_sensitive_values: forbidden
    model_provider_or_role_causal_claim_without_separate_evidence: forbidden
    candidate_runtime_and_review_transport_claims: separately_required
