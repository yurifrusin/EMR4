schema_version: ariadne.worker_pool.v1
workers:
  - resource_id: openai-primary-orchestrator
    provider: openai
    account_id: openai-subscription
    access_mode: subscription
    transport: manual
    transport_quirks: []
    default_model: gpt-sol
    default_reasoning: high
    max_instances: 1
    quota_scope: account_window
    quota_class: primary_subscription
    capabilities: [orchestrator, implementer, test_engineer, code_reviewer]
    cost_tier: 0
  - resource_id: openai-terra-tranche-executor
    provider: openai
    account_id: openai-subscription
    access_mode: subscription
    transport: bridge_subagent
    transport_quirks: [shares_primary_openai_subscription_window, no_protected_master_authority, staging_integration_only]
    default_model: gpt-5.6-terra
    default_reasoning: high
    max_instances: 1
    quota_scope: account_window
    quota_class: primary_subscription
    capabilities: [implementer, test_engineer, code_reviewer, docs_handover_auditor]
    cost_tier: 0
  - resource_id: openai-luna-mechanical-coordinator
    provider: openai
    account_id: openai-subscription
    access_mode: subscription
    transport: bridge_subagent
    transport_quirks: [shares_primary_openai_subscription_window, no_integration_authority, mechanical_receipts_only]
    default_model: gpt-5.6-luna
    default_reasoning: medium
    max_instances: 1
    quota_scope: account_window
    quota_class: primary_subscription
    capabilities: [test_engineer, docs_handover_auditor]
    cost_tier: 0
  - resource_id: claude-fable-conductor
    provider: anthropic
    account_id: claude-subscription
    access_mode: subscription
    transport: cli_print
    transport_quirks: [quota_is_observed_separately]
    default_model: fable
    default_reasoning: high
    max_instances: 1
    quota_scope: account_window
    quota_class: limited_subscription
    capabilities: [conductor, architect, code_reviewer]
    cost_tier: 2
  - resource_id: claude-opus-conductor
    provider: anthropic
    account_id: claude-subscription
    access_mode: subscription
    transport: cli_print
    transport_quirks: [shares_claude_subscription_window, quota_is_observed_separately]
    default_model: opus
    default_reasoning: medium
    max_instances: 1
    quota_scope: account_window
    quota_class: limited_subscription
    capabilities: [conductor, architect, code_reviewer]
    cost_tier: 1
  - resource_id: gpt-sol-conductor-fallback
    provider: openai
    account_id: openai-subscription
    access_mode: subscription
    transport: bridge_subagent
    transport_quirks: [shares_primary_openai_subscription_window, distinct_subagent_context_required, no_integration_authority]
    default_model: gpt-sol
    default_reasoning: high
    max_instances: 1
    quota_scope: account_window
    quota_class: primary_subscription
    capabilities: [conductor, architect, code_reviewer]
    cost_tier: 0
  - resource_id: deepseek-pro-conductor-fallback
    provider: deepseek
    account_id: deepseek-api
    access_mode: api_key
    transport: cli_interactive
    transport_quirks: [deepcode_real_tty_required, deepcode_tui_result_artifact_required, shares_deepseek_worker_quota, no_integration_authority, permission_prompts_are_not_authority]
    default_model: deepseek-v4-pro
    default_reasoning: high
    max_instances: 1
    quota_scope: api_budget
    quota_class: low_cost_api
    capabilities: [conductor, architect, code_reviewer]
    cost_tier: 1
  - resource_id: antigravity-gemini-flash-3-5-worker
    provider: antigravity
    account_id: antigravity-subscription
    access_mode: subscription
    transport: cli_print
    transport_quirks: [cli_artifact_required, quota_is_observed_separately]
    default_model: gemini-flash-3.5
    default_reasoning: medium
    max_instances: 1
    quota_scope: account_window
    quota_class: limited_subscription
    capabilities: [architect, implementer, test_engineer, security_reviewer, code_reviewer]
    cost_tier: 0
  - resource_id: deepseek-flash-verifier
    provider: deepseek
    account_id: deepseek-api
    access_mode: api_key
    transport: cli_interactive
    transport_quirks: [deepcode_real_tty_required, deepcode_tui_result_artifact_required, permission_prompts_are_not_authority]
    default_model: deepseek-v4-flash
    default_reasoning: high
    max_instances: 3
    quota_scope: api_budget
    quota_class: low_cost_api
    capabilities: [verifier, test_engineer, security_reviewer]
    cost_tier: 1
  - resource_id: deepseek-flash-workers
    provider: deepseek
    account_id: deepseek-api
    access_mode: api_key
    transport: cli_interactive
    transport_quirks: [deepcode_real_tty_required, deepcode_tui_result_artifact_required, separate_worker_packet_required, permission_prompts_are_not_authority]
    default_model: deepseek-v4-flash
    default_reasoning: high
    max_instances: 3
    quota_scope: api_budget
    quota_class: low_cost_api
    capabilities: [implementer, test_engineer, security_reviewer, code_reviewer, docs_handover_auditor]
    cost_tier: 1
