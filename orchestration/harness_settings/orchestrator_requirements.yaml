schema_version: ariadne.orchestrator_requirements.v2
continuation_events: &continuation_events
  - new_session
  - post_compaction
  - model_or_provider_change
  - restored_conversation
  - pre_sprint_planning
  - pre_worker_dispatch
  - pre_verifier_acceptance
  - pre_integration
  - pre_commit
  - pre_push
active_operation_latch:
  runtime_state_field: active_operation
  required_events: *continuation_events
  schema_version: ariadne.active_operation_latch.v1
  current_state: orchestration/continuity/ariadne-active-operation-latch/current.json
  chronological_last_prompt_is_authority: false
  terminal_handback_requires_latch_permission: true
parallelism_assessment:
  runtime_state_field: parallelism_assessment
  required_events: *continuation_events
  schema_version: ariadne.parallelism_assessment.v1
  required_lane_ids: [deepseek_flash, gemini_verifier, native_subagents]
  admitted_dispositions: [planned, dispatched, completed, reserved, declined, not_applicable]
  admitted_leverage: [positive, required_independence, neutral, negative]
  require_distinct_rationale_per_lane: true
  require_serial_constraints_or_positive_parallel_work: true
git_object_resolution:
  schema_version: ariadne.git_object_resolution_policy.v1
  required_events: *continuation_events
  source_field: active_operation.source_head
  require_full_lowercase_object_id: true
  expected_object_type: commit
  require_ancestor_of_head: true
  timeout_seconds: 5
required_adapter_observations: all_declared
worker_slot_management:
  # This is an EMR4 profile choice. The receipt core is resource-neutral.
  managed_resource_ids: [deepseek-flash-workers]
  stale_worker_policy: reuse_with_recorded_scope_or_close_before_dispatch
workspace_receipts:
  required_agent_ids: []
  require_assigned_agent_ids: true
  required_fields: [agent_id, worktree, branch, clean, at_handoff_current, recorded_at]
context_health:
  required_agent_ids: [orchestrator]
  hard_rehydration_events: *continuation_events
  required_rehydration_sources_by_event:
    new_session: &five_rehydration_sources
      - live_handover_current_baton
      - current_authority_allocation
      - active_plan_and_acceptance
      - protected_evidence_boundaries
      - git_refs_and_worktree
    post_compaction: *five_rehydration_sources
    model_or_provider_change: *five_rehydration_sources
    restored_conversation: *five_rehydration_sources
    pre_sprint_planning: *five_rehydration_sources
    pre_worker_dispatch: *five_rehydration_sources
    pre_verifier_acceptance: *five_rehydration_sources
    pre_integration: *five_rehydration_sources
    pre_commit: *five_rehydration_sources
    pre_push: *five_rehydration_sources
  provider_meter:
    soft_checkpoint_ratio: 0.70
    mandatory_rehydration_ratio: 0.85
    measurement_is_advisory_only: true
  unknown_meter_policy: require_fresh_receipt_before_high_authority_action
  high_authority_actions: [sprint_planning, worker_dispatch, verifier_acceptance, integration, commit, push]
orchestrator_rules:
  - never_infer_transport_unavailability_from_an_unrelated_probe
  - never_dispatch_when_slot_inventory_is_missing_or_stale
  - never_substitute_a_verified_assignment_without_conductor_replan_and_verifier_result
  - require_a_new_receipt_at_each_continuation_event
  - require_valid_active_operation_latch_at_each_continuation_event
  - require_explicit_parallelism_assessment_at_each_continuation_event
  - require_machine_resolved_active_operation_source_commit_at_each_continuation_event
  - never_default_to_solo_serial_work_without_recorded_lane_dispositions_and_serial_constraints
  - reassess_deepseek_gemini_and_native_subagents_at_each_named_tranche_boundary
  - never_treat_prompt_recency_alone_as_operation_replacement
  - never_issue_terminal_handback_while_active_operation_forbids_it
