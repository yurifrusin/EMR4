schema_version: ariadne.deepcode_mailbox_profile.v1
outbox:
  local_only_relative_path: local_data/ariadne-harness/deepcode-outbox
  committed_output_prohibited: true
  event_trust: untrusted_worker_output_requires_packet_artifact_validation
notify:
  adapter: deepcode_notify
  source_fields: [STATUS, DURATION, FAIL_REASON, BODY, TITLE]
  per_turn_event: true
pty_lifecycle:
  adapter: deepcode_pty_adapter
  automated_completion_event: true
  event_trust: untrusted_transport_completion_requires_artifact_validation
  deepcode_notify_hook_required_for_automated_sessions: false
  controlled_exit_required: true
inbox:
  packet_root: orchestration/agent_inbox/deepcode
  session_resume_requires_human_tty_operator: true
permissions:
  base_default_mode: askAll
  # Deep Code grants this at cwd scope. Use a disposable worker worktree whenever
  # it is pre-authorized; durable packet artifacts and orchestrator acceptance remain required.
  base_allow: [read-in-cwd, query-git-log, write-in-cwd, mutate-git-log]
  base_deny: [read-out-cwd, write-out-cwd, delete-in-cwd, delete-out-cwd, network, mcp]
  preauthorized_write_scope: entire_deepcode_process_cwd
  local_git_mutation_scope: disposable_worker_candidate_commits_only
  worker_push_and_integration_authority: prohibited
  containment_requirement: disposable_packet_scoped_worker_worktree
  packet_scope_is_semantic_not_cli_enforced: true
  packet_scoped_approval_required_for: [all_non_pre_authorized_capabilities]
  unknown_operation_requires_interactive_prompt: true
