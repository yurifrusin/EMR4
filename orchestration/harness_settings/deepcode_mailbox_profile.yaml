schema_version: ariadne.deepcode_mailbox_profile.v1
outbox:
  local_only_relative_path: local_data/ariadne-harness/deepcode-outbox
  committed_output_prohibited: true
  event_trust: untrusted_worker_output_requires_packet_artifact_validation
notify:
  adapter: deepcode_notify
  source_fields: [STATUS, DURATION, FAIL_REASON, BODY, TITLE]
  per_turn_event: true
inbox:
  packet_root: orchestration/agent_inbox/deepcode
  session_resume_requires_human_tty_operator: true
permissions:
  base_default_mode: askAll
  # An unattended notify hook needs one local outbox write. This does not grant
  # worker authority: durable packet artifacts and orchestrator acceptance remain required.
  base_allow: [read-in-cwd, query-git-log, write-in-cwd]
  base_deny: [read-out-cwd, write-out-cwd, delete-in-cwd, delete-out-cwd, mutate-git-log, network, mcp]
  preauthorized_write_boundary: local_notify_outbox_only
  packet_scoped_approval_required_for: [all_non_mailbox_project_writes]
  unknown_operation_requires_interactive_prompt: true
