schema_version: ariadne.operating_model.v3
purpose: prevent_orchestrator_drift_without_bureaucratizing_execution
sprint_boundary:
  orchestrator:
    exclusive_authority: [select_planning_mode, set_tranche_direction, authorize_protected_master_integration]
    planning_modes: [sol_direct_routine, routine_delegated_executor, independent_conductor_consultation]
    default_planning_mode: sol_direct_routine
  sol_direct_routine:
    resource_id: openai-primary-orchestrator
    may: [plan_bounded_sprint, allocate_configured_workers, dispatch_workers, run_acceptance, integrate_staging, authorize_and_integrate_protected_master]
    evidence_posture: compact_contract_or_plan_plus_deterministic_checks
    use_when: [ordinary_bounded_sprint, unambiguous_direction, no_material_authority_change]
    deepseek_pro_consultation: optional_compact_challenge_only
  routine_delegated_executor:
    preferred_resource: deepseek-pro-routine-coordinator
    fallback_resource: openai-terra-tranche-executor
    use_when: [explicit_user_request, material_parallel_allocation_complexity, protected_orchestrator_context_relief_with_clear_leverage]
    may: [plan_bounded_sprint, allocate_configured_workers, coordinate_and_accept_on_staging]
    may_not: [change_tranche_direction, expand_authority, self_authorize_protected_master_integration]
    protected_master_execution:
      allowed_when: orchestrator_issued_exact_integration_manifest
      must_match: [source_branch, exact_commit_set, required_tests, expected_diff_scope]
      stop_on: [merge_conflict, changed_commit_sha, unexpected_diff, failed_required_test, scope_drift, security_or_release_implication]
  conductor:
    mode: optional_orchestrator_selected
    consultation_triggers: [ambiguous_product_or_architecture_boundary, cross_sprint_allocation_complexity, repeated_executor_or_worker_failure, material_security_write_deployment_or_release_change, orchestrator_requests_independent_challenge]
    authority_when_selected: [define_consulted_sprint, divide_work, allocate_workers]
    may_not: [dispatch_workers, integrate, commit, push]
within_sprint:
  executive_role: selected_executor
  conductor_reentry_only_when:
    - conductor_mode_was_selected
    - sprint_scope_changes
    - worker_assignment_or_ownership_changes
    - acceptance_criteria_changes
    - sprint_is_closed_and_next_sprint_is_needed
  conductor_reentry_not_required_for:
    - waiting_for_worker
    - rerunning_same_lane
    - transport_recovery
    - artifact_path_or_process_lifecycle_correction
    - test_command_selection
    - worktree_recreation
    - removal_or_extension_of_inactive_time_limits
verifier:
  mode: risk_triggered_optional
  execution_policy_file: verifier_execution_policy.yaml
  deterministic_plan_checks_always_run: true
  external_dispatch_only_after_deterministic_pass: true
  deterministic_failure_action: no_external_model_call
  independent_llm_required_when:
    - new_security_write_deployment_or_release_authority
    - conductor_orchestrator_material_disagreement
    - mandate_or_scope_boundary_is_ambiguous
    - allocation_exceeds_declared_resource_limits
    - prior_drift_signal_affects_authority_or_ownership
  independent_llm_not_required_for:
    - ordinary_low_risk_sprint_plan
    - same_lane_execution_retry
    - deterministic_schema_or_fingerprint_check
    - transport_or_filename_correction
secure_sdlc:
  protocol_file: security_review_protocol.yaml
  material_sprint_security_delta: required
  security_sensitive_sprint_reviews: [independent_blue, fresh_context_red]
  asymmetric_packets_required: true
  purple_synthesis_owner: openai-primary-orchestrator
  pre_dispatch_gate: scripts/ariadne_security_review_gate.py
  pre_integration_gate: scripts/ariadne_security_review_gate.py
execution_controls:
  wall_clock_deadlines: inactive
  monetary_caps: inherit_cost_controls
  prefer_progress_observation_over_elapsed_time: true
  worker_may_continue_while_progress_is_observable: true
  stalled_worker_intervention_is_orchestrator_judgment: true
user_pause:
  standing_programme_authority_file: autonomous_continuation.yaml
  only_for: [unplanned_material_fork, unresolved_user_owned_choice_or_material_boundary, conflicting_evidence_changes_acceptance_meaning, exhausted_bounded_recovery, mandate_expansion, explicit_user_stop, required_human_only_action]
continuous_sprint_engine:
  enabled: true
  cycle:
    - orchestrator_closes_current_sprint
    - orchestrator_selects_planning_mode
    - selected_planner_defines_and_allocates_next_sprint
    - deterministic_plan_checks_run
    - risk_triggered_verifier_runs_if_needed
    - selected_executor_executes_on_staging
    - orchestrator_authorizes_exact_integration_manifest
    - selected_executor_integrates_protected_master_or_stops_on_variance
  conversational_handback_between_sprints: false
  conversational_handback_between_dependency_satisfied_gates: false
  stop_only_for: [user_pause_condition, explicit_user_stop]
integration_checkpoints:
  authorization_owner: orchestrator
  execution_owner: selected_executor_after_exact_authorization
  commit_and_push_regularly: true
  advance_handoff_current_after_accepted_checkpoint: true
  checkpoint_after:
    - accepted_worker_artifact
    - verified_harness_correction
    - integrated_bounded_repair
    - sprint_closeout
  workers_may_push_master: false
  executor_may_push_master_without_authorization: false
economical_execution:
  supervisor: openai-primary-orchestrator
  preferred_routine_planner: openai-primary-orchestrator
  deepseek_pro_planning_role: compact_high_leverage_consultant_not_default_coordinator
  preferred_coding_worker: deepseek-flash-workers
  preferred_workers: [deepseek-flash-workers, antigravity-gemini-flash-3-7-high-verifier]
  deepseek_flash_preferred_for: [stable_bounded_implementation_contract, mechanical_test_generation, deterministic_fixture_regeneration, contained_code_repair]
  sol_retained_surfaces: [cross_sprint_taxonomy, frozen_selection_semantics, acceptance_interpretation, authority_allocation, protected_evidence_policy, historical_evidence_reconciliation]
  rejected_flash_candidate:
    classify_before_redispatch: [mechanical, conceptual]
    mechanical_same_lane_revision_limit: 1
    conceptual_same_lane_revision_limit: 0
    conceptual_triggers: [category_meaning_error, frozen_population_vs_corpus_population_error, acceptance_semantics_error, provenance_error, authority_error]
    any_failed_revision_ends_external_correction_loop: true
    next_action: sol_recovery_lease_or_distinct_resource_with_recorded_leverage
    capability_inference_may_not_use_alone: [cached_token_volume, elapsed_time, model_reputation]
  recovered_material_change_review:
    fresh_context_gemini_veto_when_risk_triggered: true
    inherit_failed_worker_acceptance_framing: false
  worker_allocation_rule: allocate_only_distinct_bounded_surfaces; no_model_quota_is_mandatory
  gemini_preferred_for: [independent_cross_check, adversarial_review, independent_test_design]
  openai_terra_use_when: [deepseek_transport_unavailable, repeated_deepseek_acceptance_failure, tightly_coupled_high_risk_integration]
  evidence_policy: compact_tranche_ledger
