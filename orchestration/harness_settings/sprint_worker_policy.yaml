schema_version: ariadne.sprint_worker_policy.v1
worker_mix:
  antigravity:
    platform: antigravity
    default_resource_id: antigravity-gemini-flash-3-5-worker
    default_model: gemini-flash-3.5
    future_model_or_instance_expansion_requires_worker_pool_entry: true
    minimum_instances: 0
    maximum_instances: 1
    use_when: [independent_domain_review, separable_implementation, test_design, adversarial_review]
    stand_down_when: [quota_unavailable, no_distinct_artifact_or_veto_surface, overlapping_ownership]
  deepseek_flash:
    resource_id: deepseek-flash-workers
    minimum_instances: 1
    maximum_instances: 3
    use_when: [bounded_implementation, test_engineering, security_review, code_review, documentation_handover]
    lane_rule: each_lane_requires_distinct_ownership_and_local_structured_receipt; candidate_commit_is_primary_completion_artifact
planning_inputs:
  - optional_orchestrator_direction_proposal
  - optional_conductor_orchestrator_direction_dialogue
  - boundary_classification
  - required_ssdlc_obligations
  - separable_work_packages
  - declared_resource_probes
  - cost_and_quota_constraints
  - user_overrides
workspace_preflight:
  required_before_conductor_or_worker_packet:
    - target_worktree_exists
    - target_branch_matches_assigned_agent
    - target_worktree_is_clean_or_explicitly_classified
    - target_head_matches_handoff_current_or_has_recorded_divergence
    - realignment_is_executed_from_target_worktree_not_integration_worktree
  failure_posture: revision_required_before_packet_dispatch
required_plan_fields:
  - boundary
  - direction_dialogue_disposition
  - assignments
  - antigravity_decision
  - deepseek_lane_count
  - worker_packets
  - ownership_boundaries
  - verification_plan
  - fallback_reasons
  - independence_labels
  - unfilled_obligations
  - workspace_receipts
  - security_delta
  - security_review_tier
  - red_blue_packet_independence
  - purple_checkpoint_state
deterministic_plan_checks:
  - settings_fingerprint_matches
  - final_sprint_and_allocation_authored_by_conductor
  - direction_dialogue_did_not_transfer_allocation_authority
  - conductor_and_orchestrator_authority_separation
  - worker_count_within_declared_limits
  - deepseek_lanes_are_between_one_and_three
  - each_worker_has_a_distinct_artifact_or_veto_surface
  - assignment_capability_and_probe_eligibility
  - fallback_and_reduced_independence_are_explicit
  - no_orchestrator_substitution
  - workspace_receipts_match_assigned_agent_and_handoff_state
  - material_sprint_security_delta_is_complete
  - security_sensitive_triggers_require_independent_red_and_blue
  - red_and_blue_packets_are_asymmetric
  - purple_review_cadence_is_not_exceeded
independent_verifier:
  mode: risk_triggered_optional
  triggers:
    - new_security_write_deployment_or_release_authority
    - conductor_orchestrator_material_disagreement
    - ambiguous_mandate_or_scope_boundary
    - resource_limit_exception
    - authority_or_ownership_drift_signal
test_execution:
  shared_postgresql_schema:
    concurrency: serial
    applies_to: all_pytest_processes_using_repository_conftest
    preflight:
      - audit_existing_workspace_pytest_processes
      - classify_current_or_stale_before_schema_owning_run
      - retire_only_verified_stale_processes
    rationale: concurrent_create_all_drop_all_or_truncate_can_corrupt_another_test_process
  parallel_allowed_for:
    - import_free_static_checks
    - filesystem_only_checks
    - independent_browser_checks_that_do_not_load_repository_conftest
