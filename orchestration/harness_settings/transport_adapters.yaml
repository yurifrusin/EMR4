schema_version: ariadne.transport_adapters.v1
adapters:
  - adapter_id: deepseek_via_claude_code_bare
    resource_ids: [deepseek-flash-verifier, deepseek-flash-workers, deepseek-pro-conductor-fallback, deepseek-pro-routine-coordinator]
    platform: claude_code
    invocation: claude_print_bare_deepseek_api
    prompt_entrypoint: python scripts/ariadne_deepseek_claude.py
    allowed_probe_methods: [synthetic_fixture, deepseek_claude_cli_observation]
    shell_probe_applicable: true
    authority_boundary: headless_cli_transport_only_no_integration_authority
  - adapter_id: deepcode_cli
    resource_ids: [deepseek-flash-verifier, deepseek-flash-workers, deepseek-pro-conductor-fallback, deepseek-pro-routine-coordinator]
    platform: deep_code
    invocation: deepcode_prompt_tui
    prompt_entrypoint: deepcode -p <packet>
    allowed_probe_methods: [synthetic_fixture, deepcode_cli_observation]
    shell_probe_applicable: true
    authority_boundary: interactive_cli_transport_only_no_integration_authority
  - adapter_id: claude_cli_print
    resource_ids: [claude-fable-conductor, claude-opus-conductor]
    platform: claude_code
    invocation: claude_print_cli
    allowed_probe_methods: [synthetic_fixture, claude_cli_observation]
    shell_probe_applicable: true
    authority_boundary: transport_only_no_integration_authority
  - adapter_id: antigravity_cli_print
    resource_ids: [antigravity-gemini-flash-3-7-high-verifier]
    platform: antigravity
    invocation: antigravity_new_project_bound_readonly_worktree
    prompt_entrypoint: python scripts/ariadne_antigravity.py
    allowed_probe_methods: [synthetic_fixture, agy_cli_observation]
    shell_probe_applicable: true
    authority_boundary: bound_readonly_worktree_transport_only_no_integration_authority
  - adapter_id: codex_primary_session
    resource_ids: [openai-primary-orchestrator]
    platform: codex_desktop
    invocation: protected_primary_session
    allowed_probe_methods: [synthetic_fixture, codex_session_observation]
    shell_probe_applicable: false
    authority_boundary: protected_orchestrator_only
  - adapter_id: codex_subagent_spawn
    resource_ids: [gpt-sol-conductor-fallback]
    platform: codex_desktop
    invocation: bounded_subagent_spawn
    allowed_probe_methods: [synthetic_fixture, codex_subagent_observation]
    shell_probe_applicable: false
    authority_boundary: conductor_transport_only_no_integration_authority
