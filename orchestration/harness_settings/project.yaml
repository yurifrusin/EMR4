schema_version: ariadne.project_settings.v1
project_id: emr4
master_authority:
  exclusive_role: orchestrator
  conductor_can_commit: false
  verifier_can_commit: false
allocation:
  user_override_required_to_change_verified_assignment: false
  conductor_revision_required_to_change_assignment: true
  conductor_replan_required_only_when_availability_forces_assignment_change: true
  live_agent_adapters_enabled: false
operating_model:
  settings_file: operating_model.yaml
  within_sprint_executive_role: orchestrator
  independent_verifier_mode: risk_triggered_optional
secure_sdlc:
  settings_file: security_review_protocol.yaml
  material_sprint_security_delta: required
  security_sensitive_review: independent_red_blue
  purple_review_maximum_material_sprint_interval: 4
direction_collaboration:
  settings_file: direction_collaboration.yaml
  optional: true
  conductor_retains_final_say: true
autonomous_continuation:
  settings_file: autonomous_continuation.yaml
  default_posture: continue_without_user_permission
  reallocation_authority: conductor_only
  active_operation_latch: orchestration/continuity/ariadne-active-operation-latch/current.json
cost_controls:
  settings_file: cost_controls.yaml
  monetary_budget_enforcement: inactive
  activation_requires_explicit_user_override: true
